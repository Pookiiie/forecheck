<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forecheck</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d10">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forecheck">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Concept: the broadcast truck. Always dark. Every game is a TV score bug in team colours, two per row.
   Your fantasy players ride along on each game; your matchups sit on top. The page itself never scrolls
   (only #scroller and the sheet body do), and the app sits below an opaque status bar. */
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --bc:"Barlow Condensed","SF Pro Display",-apple-system,system-ui,sans-serif;
  --bg:#0b0d10;--card:#161a20;--card2:#1e232b;--well:#101318;--fill:rgba(255,255,255,.07);--sep:rgba(255,255,255,.09);
  --fg:#f2f4f7;--fg2:#8f99a8;--fg3:#5b6574;
  --red:#ff5a4f;--green:#3ddc84;--blue:#5aa9ff;--amber:#ffb020;--yellow:#f6d32d;--mine:#a8a2ff;
  --tint:#f6d32d;--ice:#18222d;--iceline:#2c3b4a;
  color-scheme:dark;
}
body[data-sport="nhl"]{--tint:#ff5263}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--fg);font:15px/1.35 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:var(--blue);text-decoration:none}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.n{font-family:var(--bc);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.nav{flex:none;background:var(--bg);border-bottom:1px solid var(--sep);padding-top:env(safe-area-inset-top,0px);z-index:5}
.nav-in{max-width:760px;margin:0 auto;height:46px;display:flex;align-items:center;gap:2px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.ttl{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:0 4px}
.ttl h1{margin:0;font:800 22px/1 var(--bc);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font:500 11.5px/1.3 var(--ui);color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small u{color:var(--blue);text-decoration:none}
.chev{width:30px;height:38px;display:grid;place-items:center;color:var(--tint);flex:none}
.chev svg{width:11px;height:19px}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:0;flex:none}
.upd{cursor:pointer;display:flex;align-items:center;gap:5px;font:600 13px var(--bc);letter-spacing:.04em;color:var(--fg2);margin-right:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.dot.on{background:var(--red);animation:blink 1.6s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.ib{width:38px;height:38px;display:grid;place-items:center;color:var(--fg2);border-radius:50%}
.ib svg{width:21px;height:21px}
.ib.busy,.upd.busy{opacity:.4}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.wrap{max-width:760px;margin:0 auto;padding-top:10px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 84px);padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));display:grid;gap:8px}
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding-bottom:max(6px,calc(env(safe-area-inset-bottom,0px) - 14px));pointer-events:none}
.tabs-in{pointer-events:auto;display:flex;gap:4px;padding:4px;border-radius:999px;
  background:rgba(32,36,44,.38);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.4)}
.tab{width:92px;height:50px;border-radius:999px;display:grid;justify-items:center;align-content:center;gap:1px;color:rgba(255,255,255,.62);font:700 11px var(--bc);letter-spacing:.1em;text-transform:uppercase;transition:background-color .2s}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:#fff;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.tab[aria-selected="true"] svg{color:var(--tint)}

/* ---------- themes (applied to the scrolling areas; header and tab bar stay broadcast-black) ---------- */
.scroll{background:var(--bg)}
body[data-sport="nfl"] .scroll{ /* Stadium night */
  --card:rgba(255,255,255,.065);--card2:rgba(255,255,255,.11);--well:rgba(0,0,0,.28);--sep:rgba(255,255,255,.1);--fill:rgba(255,255,255,.08);
  --fg2:#a9bfae;--fg3:#62806b;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 34px,transparent 34px 68px),radial-gradient(140% 55% at 50% -8%,#22603a 0%,#0e2918 46%,#08140d 100%) #08140d}
body[data-sport="nfl"] .tile,body[data-sport="nfl"] .hero,body[data-sport="nfl"] .sec,body[data-sport="nfl"] .fxc,body[data-sport="nfl"] .empty{border:1px solid rgba(255,255,255,.1)}
body[data-sport="nhl"] .scroll{ /* Night rink */
  --card:#122131;--card2:#193049;--well:#0d1925;--sep:rgba(170,205,235,.12);--fill:rgba(170,205,235,.09);--fg2:#9fb6cc;--fg3:#5f7790;--rink:#16222f;--rinkline:#2b3d50;
  }
body[data-sport="nhl"] .tile,body[data-sport="nhl"] .hero,body[data-sport="nhl"] .sec,body[data-sport="nhl"] .cal{border:1px solid rgba(255,255,255,.1)}
body[data-sport="nhl"][data-ice="light"] .scroll{ /* Fresh sheet */
  --card:#ffffff;--card2:#eef3f8;--well:#f1f5f9;--sep:rgba(12,29,43,.1);--fill:rgba(12,29,43,.06);--fg:#0c1d2b;--fg2:#4f6579;--fg3:#93a5b6;--rink:#f4f8fb;--rinkline:#c8d6e2;
  color:var(--fg);color-scheme:light;
  }
body[data-sport="nhl"][data-ice="light"] .tile,body[data-sport="nhl"][data-ice="light"] .hero,body[data-sport="nhl"][data-ice="light"] .sec,body[data-sport="nhl"][data-ice="light"] .cal{border-color:rgba(12,29,43,.08);box-shadow:0 1px 2px rgba(12,29,43,.06)}

body[data-sport="nhl"][data-ice="glass"] .scroll{ /* Glacier glass */
  --card:rgba(205,236,255,.10);--card2:rgba(205,236,255,.17);--well:rgba(6,20,36,.38);--sep:rgba(215,242,255,.16);--fill:rgba(215,242,255,.1);
  --fg2:#b6d5ec;--fg3:#7398b8;--rink:rgba(6,20,36,.55);--rinkline:rgba(190,230,255,.35);--tint:#8fe3ff;
  }
body[data-sport="nhl"][data-ice="glass"] .tile,body[data-sport="nhl"][data-ice="glass"] .hero,body[data-sport="nhl"][data-ice="glass"] .sec,body[data-sport="nhl"][data-ice="glass"] .cal{
  border:1px solid rgba(255,255,255,.1);box-shadow:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
body[data-sport="nhl"][data-ice="glass"] .cd{background:rgba(220,244,255,.07)}
body[data-sport="nhl"][data-ice="glass"] .cd.x{background:transparent}

/* rink-ice texture is drawn once on the device (iceTexture) and set as --habsbg */
body[data-sport="nhl"][data-ice] .scroll{background:var(--habsbg,none) center top/cover no-repeat,var(--icebase,#0b1622)}
body[data-sport="nhl"][data-ice="glass"]{--icebase:#0b2135}
body[data-sport="nhl"][data-ice="dark"]{--icebase:#0c1824}
body[data-sport="nhl"][data-ice="light"]{--icebase:#d3e1ec}

/* ---------- standings ---------- */
.stc{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border-radius:10px;padding:7px 10px;min-width:0}
button.stc:active{opacity:.8}
.stc-rk{font:800 24px/1 var(--bc);min-width:42px;text-align:center}
.stc-rk small{display:block;font:700 10px var(--bc);letter-spacing:.12em;color:var(--fg2);margin-top:2px;text-transform:uppercase}
.stc-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.stc-t b{font:700 14px var(--bc);letter-spacing:.1em;text-transform:uppercase}
.stc-t span{font:400 12.5px var(--ui);color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stc-t .in{color:var(--green)}.stc-t .out{color:var(--red)}
.stc .go{color:var(--fg3);width:8px;height:13px;flex:none}
/* standings strip slides out from under the score bug card, like a drawer */
.hero:has(+ .stc){position:relative;z-index:2;box-shadow:0 8px 12px -4px rgba(0,0,0,.4)}
.hero + .stc{margin:-8px 14px 0;width:auto;border-radius:0 0 10px 10px;padding:10px 10px 6px;gap:9px;background:linear-gradient(rgba(0,0,0,.10),rgba(0,0,0,.10)),var(--card);border:1px solid rgba(255,255,255,.10);border-top:0;box-shadow:inset 0 10px 10px -8px rgba(0,0,0,.4);position:relative;z-index:1}
.hero + .stc .stc-rk{font-size:20px;min-width:0;display:flex;align-items:baseline;gap:4px}
.hero + .stc .stc-rk small{display:inline;margin:0;font-size:9.5px}
.hero + .stc .stc-t{gap:0}
.hero + .stc .stc-t b{font-size:10.5px;letter-spacing:.14em;color:var(--fg2);line-height:1.25}
.hero + .stc .stc-t span{font-size:12.5px;line-height:1.3}
body[data-ice="light"] .hero + .stc{background:var(--well);border-color:rgba(12,29,43,.08);box-shadow:inset 0 10px 10px -8px rgba(12,29,43,.25)}
.stb{width:100%;border-collapse:collapse;font:700 14px var(--bc);font-variant-numeric:tabular-nums;white-space:nowrap}
.stb th{font:600 10.5px var(--ui);color:var(--fg2);text-align:right;padding:0 5px 4px}
.stb td{padding:4px 5px;text-align:right;border-top:1px solid var(--sep)}
.stb th:nth-child(-n+2),.stb td:nth-child(-n+2){text-align:left}
.stb td:first-child{width:16px;color:var(--fg3);font-size:12px;padding-left:2px}
.stb td img{width:18px;height:18px;object-fit:contain;vertical-align:-4px;margin-right:6px}
.stb tr.me td{background:color-mix(in srgb,var(--tint) 16%,transparent)}
.stb tr.cut td{border-top:2px solid color-mix(in srgb,var(--fg) 55%,transparent)}
.stb tr.wc td{border-top:2px dashed color-mix(in srgb,var(--fg) 35%,transparent)}
.stb .sub{color:var(--fg2);font-weight:600}
.brk{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mt{background:var(--well);border-radius:7px;padding:4px 6px;display:grid;gap:2px}
.mt.me{box-shadow:inset 0 0 0 1.5px var(--tint)}
.mt div{display:flex;align-items:center;gap:6px;font:700 14px var(--bc)}
.mt img{width:18px;height:18px;object-fit:contain}
.mt b{margin-left:auto;font:600 11px var(--bc);letter-spacing:.06em;color:var(--fg2)}
.mt .bye{font:500 11.5px var(--ui);color:var(--fg2)}

/* ---------- Habs month calendar ---------- */
.cal{background:var(--card);border-radius:10px;padding:5px 6px 6px}
.cal-h{display:flex;align-items:center;justify-content:space-between;font:700 13px var(--bc);letter-spacing:.14em;text-transform:uppercase;color:var(--fg2);padding:0 0 3px}
.cal-h button{width:32px;height:24px;color:var(--tint);display:grid;place-items:center}
.cal-h button svg{width:8px;height:13px}
.cal-dw,.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-dw span{font:600 10px var(--ui);color:var(--fg3);text-align:center;padding-bottom:2px}
.cd{height:38px;border-radius:5px;position:relative;display:flex;align-items:center;justify-content:center;background:var(--well);min-width:0}
.cd.x{background:transparent}
.cd .dn{position:absolute;top:1px;right:3px;font:600 9px/1 var(--ui);color:var(--fg3)}
.cd img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.cd.away img{width:26px;height:26px}
.cd .at{position:absolute;top:1px;left:3px;font:700 9px/1 var(--ui);color:var(--fg3)}
.cd.W{background:color-mix(in srgb,var(--green) 34%,transparent)!important}
.cd.L{background:color-mix(in srgb,var(--red) 34%,transparent)!important}
.cd.O{background:color-mix(in srgb,var(--amber) 36%,transparent)!important}
body[data-ice="light"] .cd.W{background:color-mix(in srgb,var(--green) 26%,#fff)!important}
body[data-ice="light"] .cd.L{background:color-mix(in srgb,var(--red) 22%,#fff)!important}
body[data-ice="light"] .cd.O{background:color-mix(in srgb,var(--amber) 26%,#fff)!important}
.cd .dn,.cd .at{z-index:1}
.cd.W .dn,.cd.L .dn,.cd.O .dn,.cd.W .at,.cd.L .at,.cd.O .at{color:#fff;font-weight:700}
body[data-ice="light"] .cd.W .dn,body[data-ice="light"] .cd.L .dn,body[data-ice="light"] .cd.O .dn,body[data-ice="light"] .cd.W .at,body[data-ice="light"] .cd.L .at,body[data-ice="light"] .cd.O .at{color:#0c1d2b}
.cd.today{box-shadow:inset 0 0 0 1.5px var(--tint)}
button.cd:active{opacity:.7}
.cal-k{display:flex;gap:10px;margin-top:5px;font:500 10.5px var(--ui);color:var(--fg3);flex-wrap:wrap}
.cal-k i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* ---------- section labels ---------- */
.lbl{display:flex;align-items:baseline;gap:8px;margin:8px 4px -2px;font:700 12px var(--bc);letter-spacing:.14em;text-transform:uppercase;color:var(--fg2);text-shadow:0 1px 2px rgba(0,0,0,.25)}
body[data-ice="light"] .lbl{text-shadow:none}
.lbl .r{margin-left:auto;letter-spacing:.04em;text-transform:none;font:500 12px var(--ui)}
.lbl.live{color:var(--red)}
.lbl.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);align-self:center}
.foot{margin:2px 4px 0;font:400 12px/1.4 var(--ui);color:var(--fg2)}
.empty{padding:22px 16px;text-align:center;color:var(--fg2);font-size:14px;background:var(--card);border-radius:10px}
.err{padding:10px 12px;border-radius:10px;background:var(--card);color:var(--red);font-size:13px}

/* ---------- two-up game tiles (mini score bugs) ---------- */
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:640px){.g2.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;background:var(--card);border-radius:9px;overflow:hidden;min-width:0;width:100%}
.tile:active{opacity:.8}
.tile.fav{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tint) 70%,transparent)}
.tl{display:flex;align-items:center;gap:6px;height:27px;padding:0 8px 0 6px;border-left:4px solid var(--c);min-width:0}
.tl+.tl{border-top:1px solid var(--sep)}
.tl img{width:18px;height:18px;object-fit:contain;flex:none}
.tl .ab{font:700 17px/1 var(--bc);letter-spacing:.03em}
.tl .rec{font:500 11px var(--ui);color:var(--fg3);white-space:nowrap}
.tl .sc{margin-left:auto;font:800 21px/1 var(--bc);font-variant-numeric:tabular-nums}
.tl.lose .ab,.tl.lose .sc{color:var(--fg3)}
.tl.lose img{opacity:.5}
.foot-ic{width:14px;height:9px;flex:none}
.tmine{display:flex;flex-wrap:wrap;gap:2px 8px;padding:4px 8px 3px;font:500 11.5px/1.3 var(--ui);color:var(--fg2);border-top:1px solid var(--sep)}
.tmine span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tmine b{font:700 10px var(--ui);letter-spacing:.04em;color:var(--mine);margin-right:3px}
.tmine i{font-style:normal;color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.tf{margin-top:auto;display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--well);font:700 12.5px/1.2 var(--bc);letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);min-width:0}
.tf .st{white-space:nowrap}
.tf .st.live{color:var(--red)}
.tf .x{margin-left:auto;font:500 11px var(--ui);letter-spacing:0;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tf .x.yl{color:var(--yellow);font:700 12px var(--bc);letter-spacing:.04em}
.tgauge{padding:4px 8px 0}

/* chain gauge: a sliver of field */
.gauge{position:relative;height:7px;border-radius:2px;background:repeating-linear-gradient(90deg,#2f7d43 0 10%,#2a733d 10% 20%);overflow:hidden}
.gauge .ez{position:absolute;top:0;bottom:0;width:7%}
.gauge .los{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--blue)}
.gauge .fd{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--yellow)}
.gauge .ball{position:absolute;top:50%;width:9px;height:6px;margin:-3px 0 0 -4.5px;border-radius:50%;background:#8b4a20;border:1px solid #fff}

/* ---------- big score bug ---------- */
.hero{display:grid;gap:7px;width:100%;background:var(--card);border-radius:12px;padding:8px}
button.hero:active{opacity:.85}
.bug{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;border-radius:7px;overflow:hidden;min-height:42px}
.bt{display:flex;align-items:center;gap:6px;padding:0 9px;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 86%,#fff) 0%,var(--c) 52%,color-mix(in srgb,var(--c) 78%,#000) 100%);min-width:0}
.bt+.bt{border-left:1px solid rgba(0,0,0,.35)}
.bt img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4));flex:none}
.bt .ab{font:800 20px/1 var(--bc);letter-spacing:.04em;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.bt .bs{margin-left:auto;font:800 28px/1 var(--bc);font-variant-numeric:tabular-nums;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.bt .bs small{font:600 12.5px var(--ui);opacity:.9;text-shadow:none}
.bt.lose .bs{opacity:.55}
.bt .foot-ic{width:16px;height:10px}
.bt.wide{grid-column:1/3}
.bt .bye{margin-left:auto;font:800 16px/1 var(--bc);letter-spacing:.14em;opacity:.92}
.bt .stack{display:flex;flex-direction:column;line-height:1;gap:2px;min-width:0;white-space:nowrap}
.bt .ab,.bt .bs,.bt .sog{white-space:nowrap}
.bt .sog{font:600 11px var(--ui);opacity:.85;text-shadow:none}
.bc{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:64px;padding:0 8px;background:#000;color:#fff;font:700 13px/1.15 var(--bc);letter-spacing:.08em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.bc .c2{font-size:17px;letter-spacing:.03em}
.bc.on .c1{color:var(--red)}
.bug.nhl .bc{min-width:72px}
.bc.w{padding:0;display:grid;grid-template-rows:1fr auto;align-items:stretch;justify-content:stretch}
.bc.w .r1{display:flex;align-items:baseline;justify-content:center;gap:5px;padding:4px 9px 3px;align-self:center;white-space:nowrap}
.bug.nhl .bc.w .c1{font-size:15px;letter-spacing:.06em}
.bug.nhl .bc.w .c2{font-size:19px;letter-spacing:.02em}
.bc.w .wbar{display:flex;align-items:center;justify-content:center;gap:4px;background:#2a2f37;padding:3px 6px;font:700 11px/1 var(--bc);letter-spacing:.1em;color:#fff;white-space:nowrap;text-transform:uppercase}
.bc.w .wbar svg{width:7px;height:7px;flex:none}
.bc.w .wbar small{font:600 9px var(--ui);color:rgba(255,255,255,.6);letter-spacing:.04em;text-transform:none}
.bug.nhl .bc .c2{color:var(--amber);font-size:22px;text-shadow:0 0 6px rgba(255,176,32,.5)}
.bug.nhl .bc .c1{color:#ffd27a}
.bug.nhl .bc.on .c1{color:var(--red)}

.under{display:grid;gap:6px;padding:0 2px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:5px}
/* goal light / touchdown flash */
.bug{position:relative}
.lamp{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;background:linear-gradient(180deg,color-mix(in srgb,var(--fc) 80%,#fff) 0%,var(--fc) 55%,color-mix(in srgb,var(--fc) 70%,#000) 100%);animation:lamp 3.4s ease forwards;overflow:hidden}

@keyframes lamp{0%{opacity:0}7%{opacity:1}14%{opacity:.75}21%{opacity:1}28%{opacity:.75}35%,82%{opacity:1}100%{opacity:0}}

.recap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.15fr);gap:4px}
.recap .s{background:var(--well);border-radius:6px;padding:3px 6px;min-width:0}

.recap .s.opp b{color:var(--fg2)}
.recap .s small{display:block;font:500 11px/1.25 var(--ui);color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recap .s small i{font-style:normal;color:var(--amber);font-size:9.5px;letter-spacing:.5px;margin-right:3px}

/* pull to refresh */
.ptr{position:absolute;left:50%;z-index:5;width:34px;height:34px;margin-left:-17px;border-radius:50%;display:grid;place-items:center;background:rgba(30,34,42,.75);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;pointer-events:none;transform:translateY(-40px)}
.ptr svg{width:22px;height:22px}

.slide-l{animation:slideL .28s ease-out}.slide-r{animation:slideR .28s ease-out}
@keyframes slideL{from{transform:translateX(26px);opacity:.4}}
@keyframes slideR{from{transform:translateX(-26px);opacity:.4}}
/* lineup check */
.fxw{font:600 11.5px/1.3 var(--ui);color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.lc{display:grid;gap:3px;padding:7px 9px;border-radius:7px;background:color-mix(in srgb,var(--red) 14%,transparent);font-size:13px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:5px;background:var(--fill);font:700 13px/1.2 var(--bc);letter-spacing:.04em;white-space:nowrap}

.fxs{display:flex;align-items:baseline;justify-content:space-between;gap:6px}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s .3s;visibility:hidden;box-shadow:-12px 0 30px rgba(0,0,0,.35)}

/* ---------- tiles ---------- */

  if (g.state === 'pre') return `<span class="st">${esc(shortDay(g.date))} ${esc(fmtTime(g.date))}</span>`;
  const ot = /(OT|SO)/.exec(g.detail || ''); return `<span class="st">Final${ot ? ' ' + ot[1] : ''}</span>`;
}
function tLine(g, t, si) {

  return `<div class="tl${lose ? ' lose' : ''}" style="--c:${teamInk(t)}">${logo(t)}<span class="ab">${esc(t.abbr)}</span>${si && si.off === t ? FOOT : ''}${g.state === 'pre' ? `<span class="rec">${esc(t.rec)}</span>` : ''}<span class="sc">${g.state === 'pre' ? '' : esc(t.score)}</span></div>`;

  const mineH = mine.length ? `<div class="tmine">${mine.map(p => `<span><b>${p.tag}</b>${esc(p.name)}${g.state !== 'pre' ? ` <i>${fmtP(p.pts)}</i>` : ''}</span>`).join('')}</div>` : '';

/* ---------- big score bug ---------- */

  const si = G.sp === 'nfl' && live ? nflSit(G) : null;
  const slab = t => { const lose = G.state === 'post' && !t.winner && (G.home.winner || G.away.winner); return `<div class="bt${lose ? ' lose' : ''}" style="--c:${slabColor(t)}">${logo(t, true)}<span class="stack"><span class="ab">${esc(t.abbr)}</span>${sog ? `<span class="sog">SOG ${esc(sog[t === G.home ? 'h' : 'a'])}</span>` : pre && t.rec ? `<span class="sog">${esc(t.rec)}</span>` : ''}</span>${si && si.off === t ? FOOT : ''}${pre ? '' : `<span class="bs">${esc(t.score)}</span>`}</div>`; };
  let c;
  if (live) { const d = G.detail || ''; c = /half|end|intermission/i.test(d) ? `<span class="c1">${esc(d.replace(/^End of /i, 'End '))}</span>` : `<span class="c1">${esc(G.sp === 'nfl' ? qLab(G.period) : pLab(G.period))}</span><span class="c2">${esc(G.clock || '')}</span>`; }
  else if (pre) c = `<span class="c1">${esc(shortDay(G.date))}</span><span class="c2">${esc(fmtTime(G.date))}</span>`;
  else { const ot = /(OT|SO)/.exec(G.detail || ''); c = `<span class="c1">Final</span>${ot ? `<span class="c2">${ot[1]}</span>` : ''}`; }
  // where to watch rides along on a grey bar at the foot of the clock box, with day and time on one row above it
  const w = watch && watch.main && watch.main[0];
  if (w) { const P = PROV[w.p]; return `<div class="bug ${G.sp}${lg ? ' lg' : ''}">${slab(G.away)}${slab(G.home)}<div class="bc w${live ? ' on' : ''}"><span class="r1">${c}</span><span class="wbar">${PLAY}${esc(P.bug || P.name)}${P.lang ? ` <small>${esc(P.lang)}</small>` : ''}${w.note ? ` <small>${esc(w.note)}</small>` : ''}</span></div></div>`; }
  return `<div class="bug ${G.sp}${lg ? ' lg' : ''}">${slab(G.away)}${slab(G.home)}<div class="bc${live ? ' on' : ''}">${c}</div></div>`;
}
function flagUnder(G) {
  const si = G.sp === 'nfl' && G.state === 'in' ? nflSit(G) : null; if (!si) return '';
  return `${si.off ? `<div class="flag"><b>${esc(si.dd || '')}</b><span>${si.spot ? 'at ' + esc(si.spot) : ''}</span>${si.rz ? '<b class="rzb">Red zone</b>' : ''}</div>${gauge(si, G)}` : ''}${si.text ? `<div class="play">${esc(si.text)}</div>` : ''}`;

/* ---------- goal light / touchdown flash ----------
   Scores seen are remembered on the device, so a goal scored while the app was closed still
   lights up the next time it opens. Only fires on a change, never on the first look at a game. */
const SEEN = LS.get('seen', {});
function scoreFlash(g) {
  if (!g || g.state === 'pre') return null;
  const now = Date.now(), prev = SEEN[g.id], cur = { h: +g.home.score || 0, a: +g.away.score || 0, t: now };
  SEEN[g.id] = cur; SEEN._dirty = 1;
  if (!prev) return null;
  const dh = cur.h - prev.h, da = cur.a - prev.a; if (dh <= 0 && da <= 0) return null;
  const fav = hasFav(g);
  let t = dh > 0 ? g.home : g.away;
  if (dh > 0 && da > 0) t = isFav(g.sp, g.away.abbr) ? g.away : g.home;
  const d = t === g.home ? dh : da;
  const mine = !fav || isFav(g.sp, t.abbr);
  const label = g.sp === 'nhl' ? (d > 1 ? d + ' GOALS' : 'GOAL') : d >= 6 ? 'TOUCHDOWN' : d === 3 ? 'FIELD GOAL' : d === 1 ? '' : '+' + d;
  return { side: t === g.home ? 1 : 0, label, color: slabColor(t), mine, sp: g.sp };
}
function saveSeen() { if (!SEEN._dirty) return; delete SEEN._dirty; const now = Date.now(); for (const k in SEEN) if (now - SEEN[k].t > 2 * 864e5) delete SEEN[k]; LS.set('seen', SEEN); }
function applyFlash(root, f) {
  saveSeen(); if (!root || !f) return;
  const bugEl = root.querySelector('.bug'); if (!bugEl) return;
  const slab = bugEl.querySelectorAll('.bt')[f.side];
  if (!f.mine || !f.label) { if (slab) slab.classList.add('ping'); return; }
  const el = document.createElement('div'); el.className = 'lamp'; el.style.setProperty('--fc', f.color); el.innerHTML = `<span>${esc(f.label)}</span>`;
  el.addEventListener('animationend', e => { if (e.target === el) el.remove(); });
  bugEl.appendChild(el);
  const card = bugEl.closest('.hero'); if (card) { card.style.setProperty('--fc', f.sp === 'nhl' ? '#ff2a1f' : f.color); card.classList.add('lit'); setTimeout(() => card.classList.remove('lit'), 4000); }
}
function pingTiles(games) {
  games.forEach(g => { if (g.state !== 'in') return; const f = scoreFlash(g); if (!f) return; const tl = document.querySelectorAll(`.tile[data-open="${g.sp}:${g.id}"] .tl`)[f.side]; if (tl) tl.classList.add('ping'); });
  saveSeen();
}

/* ---------- Habs post-game recap: three stars and the goalie ---------- */
async function habsRecap(g, ab) {
  try {
    const s = await cached('sum:' + g.id, 10 * 60e3, () => espn('nhl', 'summary?event=' + g.id));
    const fa = ((s.header.competitions[0] || {}).status || {}).featuredAthletes || [];
    const line = {};
    ((s.boxscore && s.boxscore.players) || []).forEach(b => (b.statistics || []).forEach(c => { const lab = c.labels || []; (c.athletes || []).forEach(a => { const v = k => { const i = lab.indexOf(k); return i >= 0 ? a.stats[i] : null; }; line[String(a.athlete.id)] = { team: b.team.abbreviation, gk: c.name === 'goalies', name: a.athlete.shortName || a.athlete.displayName, g: v('G'), a: v('A'), sv: v('SV'), sa: v('SA'), svp: v('SV%'), toi: v('TOI') }; }); }));
    const stars = ['firstStar', 'secondStar', 'thirdStar'].map(n => fa.find(f => f.name === n)).filter(Boolean);
    const gk = Object.values(line).filter(x => x.gk && x.team === ab && secs(x.toi) > 0).sort((x, y) => (+y.sa || 0) - (+x.sa || 0))[0];
    const cards = stars.map((f, i) => { const id = String(f.playerId || (f.athlete && f.athlete.id) || ''); const L = line[id] || {}; const nm = (f.athlete && (f.athlete.shortName || f.athlete.displayName)) || L.name || ''; const team = L.team || (f.team && f.team.abbreviation) || ''; const st = L.gk ? `${L.sv} SV` : [+L.g ? L.g + 'G' : '', +L.a ? L.a + 'A' : ''].filter(Boolean).join(' ') || ''; const opp = team && team !== ab; return `<div class="s${opp ? ' opp' : ''}"><b>${esc(nm.replace(/^\w\. /, ''))}</b><small><i>${'★'.repeat(i + 1)}</i>${esc([st, opp ? team : ''].filter(Boolean).join(' · '))}</small></div>`; });
    if (gk) cards.push(`<div class="s"><b>${esc(gk.name.replace(/^\w\. /, ''))}</b><small><i class="sv">${esc(gk.svp)}</i>${esc(gk.sv)}/${esc(gk.sa)} SV</small></div>`);
    const h = cards.length ? `<div class="recap">${cards.join('')}</div>` : '';
    return h;
  } catch (e) { return ''; }
}

/* ---------- favourite team ---------- */
async function teamSchedule(sp, abbr) {
  return cached('sched:' + sp + abbr, 10 * 60e3, async () => {
    const [j, rm] = await Promise.all([espn(sp, 'teams/' + abbr.toLowerCase() + '/schedule'), recMap(sp).catch(() => ({}))]);
    const games = (j.events || []).map(e => { try { return mkGame(sp, e); } catch (x) { return null; } }).filter(Boolean);
    // team schedules carry no records, so upcoming games borrow today's records from the standings
    games.forEach(g => { if (g.state === 'pre') [g.home, g.away].forEach(t => { if (!t.rec && rm[t.abbr]) t.rec = rm[t.abbr]; }); });
    return { team: j.team || {}, games };
  });
}
const resultLine = (g, ab) => { const me = g.home.abbr === ab ? g.home : g.away, o = me === g.home ? g.away : g.home; const wl = me.winner ? 'W' : o.winner ? 'L' : 'T'; const ot = /(OT|SO)/.exec(g.detail || ''); return `${wl} ${esc(me.score)}–${esc(o.score)}${ot ? ' ' + ot[1] : ''} ${me === g.home ? 'vs' : '@'} ${esc(o.abbr)}`; };
const nextLine = (g, ab) => { const o = g.home.abbr === ab ? g.away : g.home; return `${g.home.abbr === ab ? 'vs' : '@'} ${esc(o.abbr)} · ${esc(whenLabel(g.date))}`; };
async function heroHTML(sp, games, extra = {}) {
  const ab = sp === 'nfl' ? CFG.favNFL : CFG.favNHL; if (!ab) return '';
  const g = games.find(x => x.home.abbr === ab || x.away.abbr === ab);
  let next = null, last = null, team = {};
  try { const sc = await teamSchedule(sp, ab); team = sc.team; next = sc.games.find(x => x.state !== 'post' && x.date > Date.now() - 6 * 36e5 && (!g || x.id !== g.id)); const done = sc.games.filter(x => x.state === 'post' && (!g || x.id !== g.id)); last = done[done.length - 1]; } catch (e) {}
  if (g) {
    const under = [flagUnder(g)];
    if (g.state === 'post' && next) under.push(`<div class="meta">Next: ${nextLine(next, ab)}</div>`);
    if (sp === 'nhl' && g.state === 'post') under.push(await habsRecap(g, ab));
    const wg = showWatch(g) ? pickWatch(g) : null; if (wg && !wg.main.length) under.push(watchChips(g));
    return { html: `<button class="hero" data-open="${sp}:${g.id}">${bug(g, { watch: wg })}${under.join('') ? `<div class="under">${under.join('')}</div>` : ''}</button>`, id: g.id, g };
  }
  if (sp === 'nfl' && extra.byes && extra.byes.includes(ab)) {
    const me = { abbr: ab, color: '#' + (team.color || '333'), alt: '#' + (team.alternateColor || team.color || '333'), logo: `https://a.espncdn.com/i/teamlogos/${sp}/500/${ab.toLowerCase()}.png` };
    me.logoDark = me.logo.replace('/500/', '/500-dark/');
    return { html: `<button class="hero" ${next ? `data-open="${sp}:${next.id}"` : ''}><div class="bug ${sp}"><div class="bt wide" style="--c:${slabColor(me)}">${logo(me, true)}<span class="ab">${esc(ab)}</span><span class="bye">Bye week</span></div><div class="bc"><span class="c1">${next ? 'Next' : ''}</span><span class="c2">${next ? esc(shortDay(next.date)) : ''}</span></div></div>
      <div class="under"><div class="meta">${next ? 'Next: ' + nextLine(next, ab) : ''}${last ? ` · Last: ${resultLine(last, ab)}` : ''}</div></div></button>`, id: null };
  }
  if (next) {
    const under = [];
    const wn = showWatch(next) ? pickWatch(next) : null; if (wn && !wn.main.length) under.push(watchChips(next));
    if (last) {
      const rc = sp === 'nhl' && Date.now() - last.date < 30 * 36e5 ? await habsRecap(last, ab) : '';
      under.push(`<div class="lastg" data-open="${sp}:${last.id}"><div class="lh"><b>Last game</b><span>${resultLine(last, ab)}</span><i>${esc(shortDay(last.date))}</i></div>${rc}</div>`);
    }
    return { html: `<button class="hero" data-open="${sp}:${next.id}">${bug(next, { watch: wn })}${under.length ? `<div class="under">${under.join('')}</div>` : ''}</button>`, id: next.id, g: next };
  }
  return { html: '', id: null };
}

/* ---------- Football (with fantasy) ---------- */
function nflModel(j) { const map = {}; (j.events || []).forEach(e => { const g = mkGame('nfl', e); map[g.home.abbr] = g; map[g.away.abbr] = g; }); return { map, week: j.week && j.week.number, year: (j.season && j.season.year) || new Date().getFullYear(), byes: ((j.week && j.week.teamsOnBye) || []).map(t => t.abbreviation) }; }
async function nflNow() { return cached('nflnow', 15e3, async () => nflModel(await espn('nfl', 'scoreboard'))); }
async function loadFantasy(nfl) {
  const out = {}; const jobs = [];
  if (CFG.sleeperLeague) jobs.push(sleeperData(nfl).then(m => out.sv = m).catch(e => out.svErr = e.message));
  if (CFG.cbsToken) jobs.push(cbsData(nfl).then(m => out.cv = m).catch(e => out.cvErr = e.message));
  await Promise.all(jobs); FX.data = out; buildByTeam();
  ['sv', 'cv'].forEach(k => { try { if (out[k]) wpRecord(k, out[k]); } catch (e) {} });
  return out;
}
/* Rough win chance: projected margin over its uncertainty. ~12 pts of spread per player still to
   play (projection error + game variance), which lines up with Sleeper's own numbers in testing. */
function oddsOf(m) { if (!m || !m.me || !m.opp) return null; const sd = Math.max(5, Math.sqrt(m.me.left + m.opp.left) * 12); return Math.round(clamp(ncdf((m.me.est - m.opp.est) / sd), .01, .99) * 100); }
/* ---------- lineup check: starters who can't score, before their game starts ---------- */
const INJ_OUT = /^(out|o|doubtful|d|ir|injured reserve|pup|sus|suspended|na|cov|dnr)$/i;
const injWord = v => ({ O: 'Out', OUT: 'Out', D: 'Doubtful', IR: 'IR', PUP: 'PUP', SUS: 'Suspended', NA: 'Inactive', COV: 'Out', DNR: 'Out' })[String(v).toUpperCase()] || String(v).replace(/^\w/, c => c.toUpperCase());
function lineupIssues(m) {
  if (!m || !m.me || !m.nfl) return [];
  const nfl = m.nfl, out = [];
  m.me.rows.filter(r => r.st).forEach(r => {
    if (r.id === '0' || !r.name || r.name === '0') { out.push({ name: (r.slot || 'Starter') + ' slot', why: 'Empty', lvl: 2 }); return; }
    const ab = nflAbbr(r.team || ''); const g = nfl.map[ab];
    if (g && g.state !== 'pre') return;
    if (ab && nfl.byes.includes(ab)) { out.push({ name: r.name, why: 'Bye', lvl: 2 }); return; }
    if (!ab) { out.push({ name: r.name, why: 'Free agent', lvl: 2 }); return; }
    const inj = String(r.inj || '').trim();
    if (/^(questionable|q)$/i.test(inj)) out.push({ name: r.name, why: 'Questionable', lvl: 1 });
    else if (inj && INJ_OUT.test(inj)) out.push({ name: r.name, why: injWord(inj), lvl: 2 });
  });
  return out.sort((a, b) => b.lvl - a.lvl);
}
function lineupCard(issues) {
  if (!issues.length) return '';
  const bad = issues.filter(i => i.lvl === 2);
  return `<div class="fxw${bad.length ? '' : ' q'}">⚠ ${issues.map(i => esc(lastName(i.name) + ' ' + (i.why === 'Questionable' ? 'Q' : i.why === 'Empty' ? '' : i.why.toLowerCase())).trim()).join(' · ')}</div>`;
}
function lineupSheet(issues) {
  if (!issues.length) return '';
  const bad = issues.filter(i => i.lvl === 2);
  return `<div class="lc${bad.length ? '' : ' q'}"><b>${bad.length ? 'Fix your lineup' : 'Keep an eye on'}</b>${issues.map(i => `<span>${esc(i.name)} <em>· ${esc(i.why)}</em></span>`).join('')}</div>`;
}

/* ---------- win chance over the week ----------
   Snapshots are kept on this device each time the app loads fantasy data. The x-axis is how much
   of the week's football has been played, so Sunday afternoon gets the room and the gaps between
   game days collapse. Big jumps are tagged with the player whose points moved the most. */
function slateGames(nfl) { const seen = {}; return Object.values(nfl.map).filter(g => !seen[g.id] && (seen[g.id] = 1)); }
const slateProg = nfl => { const gs = slateGames(nfl); return gs.length ? gs.reduce((a, g) => a + (1 - remainFrac(g)), 0) / gs.length : 0; };
function wpRecord(key, m) {
  const o = oddsOf(m); if (o == null || !m.nfl) return;
  const id = `wp:${key}:${m.nfl.year}:${m.week}`;
  const R = LS.get(id, null) || { pts: [], last: null };
  const pm = {}; [m.me, m.opp].forEach((t, i) => t && t.rows.filter(r => r.st).forEach(r => { pm[(i ? 'o|' : 'm|') + r.name] = r.pts; }));
  const p = Math.round(slateProg(m.nfl) * 1e4) / 1e4; const L = R.pts[R.pts.length - 1];
  let tag = null;
  if (L && R.last && Math.abs(o - L.o) >= 8) {
    let best = null; for (const k in pm) { const d = pm[k] - (R.last[k] || 0); if (!best || Math.abs(d) > Math.abs(best.d)) best = { k, d }; }
    if (best && Math.abs(best.d) >= 2) tag = { n: lastName(best.k.slice(2)), d: Math.round(best.d * 10) / 10, me: best.k[0] === 'm', j: o - L.o };
  }
  if (L && Math.abs(p - L.p) < .002) { if (L.o === o) { R.last = pm; LS.set(id, R); return; } L.o = o; if (tag) L.s = tag; }
  else R.pts.push(tag ? { p, o, s: tag } : { p, o });
  if (R.pts.length > 480) R.pts = R.pts.filter((x, i) => x.s || i % 2 === 0 || i === R.pts.length - 1);
  R.last = pm; LS.set(id, R);
  try { Object.keys(localStorage).forEach(k => { const m2 = /^fc_wp:(\w+):\d+:(\d+)$/.exec(k); if (m2 && m2[1] === key && +m2[2] !== +m.week) localStorage.removeItem(k); }); } catch (e) {}
}
function wpGraph(key, m) {
  const R = LS.get(`wp:${key}:${m.nfl.year}:${m.week}`, null);
  if (!R || R.pts.length < 2) return `<p class="foot" style="margin:0">The win-chance graph fills in as you check the app during the week's games.</p>`;

    const row = r => `<div class="pl${r.st ? '' : ' bench'}"><span class="slot">${esc(r.slot || r.pos)}</span><div class="pn"><div class="n">${esc(r.name)}${r.inj ? ` <span style="color:#ff9f0a;font-size:11px;font-weight:700">${esc(String(r.inj).slice(0, 3).toUpperCase())}</span>` : ''}</div><div class="m">${esc(r.pos)}${r.team ? ' ' + esc(r.team) : ''}${gameTag(r.team, nfl)}</div></div><div class="pp"><div class="v">${fmtP(r.pts)}</div><div class="j">${r.proj != null ? fmtP(r.proj) : ''}</div></div></div>`;
    const st = t.rows.filter(r => r.st), bn = t.rows.filter(r => !r.st);
    body = st.map(row).join('') + (bn.length ? `<div class="bh">Bench</div>` + bn.map(row).join('') : '');
  }
  return `<section class="sec"><h2><span>${esc(M.title)}</span><span class="r">${esc(src)} · Week ${esc(week)}</span></h2>${top}</section>${body ? `<section class="sec flush">${body}</section>` : ''}`;
}
async function warmMine() { try { const nfl = await nflNow(); FX.week = nfl.week; await loadFantasy(nfl); } catch (e) {} }

   ===================================================================== */
const CONSOLE_LINE = "m=document.documentElement.outerHTML.match(/token[\"']?\\s*[:=]\\s*[\"']([A-Za-z0-9_\\-.]{20,})[\"']/); m ? (copy(m[1]), 'Copied: ' + m[1].length + ' characters') : 'No token found'";
function decodeSetup(raw) { const j = JSON.parse(decodeURIComponent(escape(atob(String(raw || '').replace(/\s+/g, '').replace(/^FC1/, ''))))); if (!j || typeof j !== 'object') throw new Error('bad'); return j; }
function fillSleeperTeams(users, rosters) {
  const sel = $('#sfSlTeam'); if (!sel) return;
  sel.innerHTML = rosters.map(r => { const u = users.find(x => x.user_id === r.owner_id) || {}; const n = (u.metadata && u.metadata.team_name) || u.display_name || 'Roster ' + r.roster_id; return `<option value="${r.roster_id}" ${String(r.roster_id) === String(CFG.sleeperRoster) ? 'selected' : ''}>${esc(n)}</option>`; }).join('');
}
async function renderStatus(banner) {
  const box = $('#sfStatus'); if (!box) return;

  const cb = CFG.cbsToken ? (CFG.cbsTeam ? '✓ Token saved' : 'Pick your team') : CFG.cbsTeam ? 'Needs your token' : 'Not set up';
  const paint = () => { $('#sfBanner').innerHTML = banner ? `<div class="banner">${banner}</div>` : ''; box.innerHTML = row('Favourites', 'ok', '✓ ' + esc([CFG.favNFL, CFG.favNHL].filter(Boolean).join(' · ') || 'None')) + row('Sleeper', slc, sl) + row('CBS', CFG.cbsToken ? 'ok' : '', cb); };
  paint();
  if (CFG.sleeperLeague) {
    try {
      const [lg, users, rosters] = await Promise.all([SL('league/' + CFG.sleeperLeague), SL('league/' + CFG.sleeperLeague + '/users'), SL('league/' + CFG.sleeperLeague + '/rosters')]);
      if (!lg) throw new Error('league not found');
      const r = rosters.find(x => String(x.roster_id) === String(CFG.sleeperRoster)); const u = r && users.find(x => x.user_id === r.owner_id);
      sl = '✓ ' + esc(lg.name) + (u ? ' · ' + esc((u.metadata && u.metadata.team_name) || u.display_name) : ' · pick your team'); slc = 'ok';

    } catch (e) { sl = '✕ ' + esc(e.message); slc = 'no'; }
    paint();
  }
}

  $('#shRight').innerHTML = '<button class="done" id="sfSave">Save</button>';
  const opt = (list, v) => list.map(a => `<option ${a === v ? 'selected' : ''}>${a}</option>`).join('');
  $('#shBody').innerHTML = `
  <div id="sfBanner"></div>
  <section class="sec flush"><h2><span>Status</span></h2><div id="sfStatus"></div></section>
  <section class="sec flush"><h2><span>Setup code</span></h2><textarea id="sfCode" placeholder="Paste your FC1… code here" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Setup code"></textarea><button class="row btn" id="sfApply" style="border-top:1px solid var(--sep)">Apply code</button></section>
  <p class="foot" id="sfCodeMsg" role="status">Fills in your teams and leagues in one go.</p>
  <section class="sec flush"><h2><span>Favourite teams</span></h2><div>
    <label class="row"><span class="k">NFL</span><select id="sfNfl"><option value="">None</option>${opt(NFL_TEAMS, CFG.favNFL)}</select></label>
    <label class="row"><span class="k">NHL</span><select id="sfNhl">${opt(NHL_TEAMS, CFG.favNHL)}</select></label>
    <label class="row"><span class="k">Habs look</span><select id="sfIce">${[['glass', 'Glacier glass'], ['dark', 'Night rink'], ['light', 'Fresh sheet']].map(([v, l]) => `<option value="${v}" ${(CFG.look || 'glass') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div></section>
  <section class="sec flush"><h2><span>Habs: your services</span></h2><div id="sfWatch"></div></section>
  <p class="foot">Tap in order of preference. Each Habs game shows only the first one carrying it; the others are listed in small print in the game details.</p>
  <section class="sec flush"><h2><span>Sleeper</span></h2><div>
    <label class="row"><span class="k">League ID</span><input id="sfSl" inputmode="numeric" autocomplete="off" value="${esc(CFG.sleeperLeague)}" placeholder="Required"></label>
    <label class="row"><span class="k">Your team</span><select id="sfSlTeam"><option value="${esc(CFG.sleeperRoster)}">${CFG.sleeperRoster ? 'Loading…' : 'Load teams first'}</option></select></label>
    <button class="row btn" id="sfSlLoad">Load teams</button></div></section>
  <section class="sec flush"><h2><span>CBS</span></h2><div>
    <label class="row"><span class="k">Token</span><input id="sfCbs" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(CFG.cbsToken)}" placeholder="Paste token"></label>
    <label class="row"><span class="k">Your team</span><select id="sfCbsTeam"><option value="${esc(CFG.cbsTeam)}">${CFG.cbsTeam ? 'Team ' + esc(CFG.cbsTeam) : 'Load teams first'}</option></select></label>
    <button class="row btn" id="sfCbsLoad">Load teams</button>
    <button class="row btn" id="sfCbsDiag">Copy CBS diagnostics</button></div></section>
  <p class="foot">CBS has no public login for apps like this, so Forecheck uses the token CBS gives your own league page. On a computer, open your league\u2019s rules page in Chrome or Edge while signed in, press F12, open Console, paste the line below and press Enter. It copies the token; send it to your phone and paste it above. Tokens can expire; if CBS stops loading, repeat this.</p>
  <code class="code">${esc(CONSOLE_LINE)}</code>
  <section class="sec flush"><button class="row btn red" id="sfReset">Clear saved data</button></section>
  <p class="foot" id="sfMsg">Settings are stored only on this device.</p>`;
  renderStatus(banner);
  $('#sfApply').onclick = () => {
    const msg = $('#sfCodeMsg'); const raw = $('#sfCode').value;
    if (!raw.trim()) { msg.style.color = 'var(--red)'; msg.textContent = 'Paste the code first.'; return; }
    let j; try { j = decodeSetup(raw); } catch (e) { msg.style.color = 'var(--red)'; msg.textContent = 'That code didn’t work. Make sure it was copied in full, starting with FC1.'; return; }
    let n = 0; ['favNFL', 'favNHL', 'sleeperLeague', 'sleeperRoster', 'cbsToken', 'cbsTeam'].forEach(k => { if (j[k] != null && j[k] !== '') { CFG[k] = String(j[k]); n++; } });
    if (!n) { msg.style.color = 'var(--red)'; msg.textContent = 'That code had nothing in it to apply.'; return; }
    saveCfg(); for (const k in memo) delete memo[k]; MY_NAMES.clear(); warmMine();
    openSettings('✓ Setup code applied and saved');
  };
  $('#sfSlLoad').onclick = async () => { const L = $('#sfSl').value.trim(); if (!L) return; try { const [users, rosters] = await Promise.all([SL('league/' + L + '/users'), SL('league/' + L + '/rosters')]); fillSleeperTeams(users, rosters); toast('Teams loaded'); } catch (e) { $('#sfMsg').textContent = 'Sleeper: ' + e.message; } };

  $('#sfCbsDiag').onclick = async () => { if (!CFG.cbsToken) { toast('Add your CBS token first'); return; } const txt = await cbsDiagnostics(); try { await navigator.clipboard.writeText(txt); toast('Copied (field names only, no scores or token)'); } catch (e) { $('#sfMsg').textContent = txt; } };
  let watchSel = myWatch().slice();
  const drawWatch = () => { $('#sfWatch').innerHTML = Object.entries(PROV).map(([k, P]) => { const i = watchSel.indexOf(k); return `<button class="row svc${i >= 0 ? ' on' : ''}" data-svc="${k}" aria-pressed="${i >= 0}"><span class="n">${i >= 0 ? i + 1 : ''}</span><span class="k">${esc(P.app)}<small>${esc([P.tv && P.tv !== P.app ? P.tv + ' on TV' : '', P.lang].filter(Boolean).join(' · '))}</small></span></button>`; }).join(''); };
  drawWatch();
  $('#sfWatch').onclick = e => { const b = e.target.closest('[data-svc]'); if (!b) return; const k = b.dataset.svc; watchSel = watchSel.includes(k) ? watchSel.filter(x => x !== k) : watchSel.concat(k); drawWatch(); };
  $('#sfSave').onclick = () => { CFG.watch = watchSel.slice(); CFG.look = $('#sfIce').value; applyIce(); CFG.favNFL = $('#sfNfl').value; CFG.favNHL = $('#sfNhl').value; CFG.sleeperLeague = $('#sfSl').value.trim(); CFG.sleeperRoster = $('#sfSlTeam').value; CFG.cbsToken = $('#sfCbs').value.trim(); CFG.cbsTeam = $('#sfCbsTeam').value; saveCfg(); for (const k in memo) delete memo[k]; MY_NAMES.clear(); toast('Saved'); closeSheet(); };
  $('#sfReset').onclick = () => { const b = $('#sfReset'); if (b.dataset.armed) { LS.del('cfg'); LS.del('sp_players'); CFG = Object.assign({}, DEFAULTS); MY_NAMES.clear(); FX.data = {}; FX.byTeam = {}; toast('Cleared'); closeSheet(); } else { b.dataset.armed = '1'; b.textContent = 'Tap again to clear everything'; } };
}

/* =====================================================================
   REFRESH LOOP + EVENTS
   ===================================================================== */
async function refresh(force) {
  clearTimeout(S.timer);
  if (document.hidden && !force) { S.timer = setTimeout(refresh, 30e3); return; }
  if (S.busy && !force) return; S.busy = true; $('#refreshBtn').classList.add('busy');
  let live = false;
  try {
    if (S.sheetMode === 'game') live = await loadDetail();
    else if (S.sheetMode === 'fx') live = await loadFxSheet();
    else if (S.sheetMode === 'stand') live = await loadStandSheet();
    else if (S.sheetMode === 'settings') live = S.live;
    else if (S.tab === 'nhl') live = await loadNHL();
    else live = await loadNFL();
    setUpdated(live);
  } catch (e) {
    const msg = navigator.onLine === false ? 'You’re offline. Scores refresh when you reconnect.' : 'Couldn’t load (' + e.message + '). Retrying shortly.';
    if (!S.sheetMode && !$('#view').querySelector('.tile,.hero,.sec')) $('#view').innerHTML = `<div class="err">${esc(msg)}</div>`; else toast(msg);
  } finally {
    S.busy = false; $('#refreshBtn').classList.remove('busy');
    S.timer = setTimeout(refresh, live ? 15e3 : 60e3);
  }
}
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) { const [sp, id] = o.dataset.open.split(':'); openGame(sp, id); return; }
  const fo = e.target.closest('[data-fxopen]'); if (fo) { openFx(fo.dataset.fxopen); return; }
  const so = e.target.closest('[data-stand]'); if (so) { openStand(so.dataset.stand); return; }
  const t = e.target.closest('[data-tab]'); if (t) { if (S.sheetMode) { S.sheetMode = null; S.detail = null; $('#sheet').classList.remove('open'); } setTab(t.dataset.tab); return; }
  if (e.target.closest('[data-now]')) { S.nfl.q = null; refresh(true); return; }
  const cm = e.target.closest('[data-cal]'); if (cm) { shiftMonth(+cm.dataset.cal); return; }
  const p = e.target.closest('[data-ptab]'); if (p && S.detail) { S.detail.tab = p.dataset.ptab; renderDetail(); return; }
  const f = e.target.closest('[data-fx]'); if (f) { const [k, v] = f.dataset.fx.split(':'); S.fx[k] = v; const m = FX.data[k]; if (m && S.sheetMode === 'fx') { const keep = $('#shScroll').scrollTop; $('#shBody').innerHTML = renderFx(m); $('#shScroll').scrollTop = keep; } return; }
  if (e.target.closest('[data-settings]')) { openSettings(); return; }
});
$('#prevBtn').onclick = () => shiftWeek(-1);
$('#nextBtn').onclick = () => shiftWeek(1);
$('#sheetBack').onclick = closeSheet;
$('#settingsBtn').onclick = () => openSettings();
$('#refreshBtn').onclick = () => { delete memo.nflnow; refresh(true); };

/* ---------- gestures: pull to refresh, swipe between tabs / months, swipe back from a sheet ---------- */
const PTR_ICON = { nfl: '<svg viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="12" rx="9.5" ry="5.6" transform="rotate(-35 12 12)" fill="#8b4a20" stroke="#fff" stroke-width="1.2"/><path d="M9.2 14.8l5.6-5.6M10.3 11.7l2 2M11.7 10.3l2 2" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>', nhl: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#101215" stroke="rgba(255,255,255,.4)" stroke-width="1"/><circle cx="12" cy="12" r="6.6" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/><path d="M12 3.6v3.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M7.2 7.6a6 6 0 0 1 3.2-1.9" stroke="rgba(255,255,255,.5)" stroke-width="1" fill="none" stroke-linecap="round"/></svg>' };
function gestures(scroller, ptr, mode) {
  let G = null;
  const place = () => { ptr.style.top = (scroller.offsetTop + 8) + 'px'; };
  scroller.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { G = null; return; }
    const t = e.touches[0]; place();
    G = { x: t.clientX, y: t.clientY, t: Date.now(), top: scroller.scrollTop, lock: null, dx: 0, dy: 0, tgt: e.target };
  }, { passive: true });
  scroller.addEventListener('touchmove', e => {
    if (!G || e.touches.length !== 1) return; const t = e.touches[0];
    G.dx = t.clientX - G.x; G.dy = t.clientY - G.y;
    if (!G.lock && (Math.abs(G.dx) > 10 || Math.abs(G.dy) > 10)) G.lock = Math.abs(G.dx) > Math.abs(G.dy) * 1.3 ? 'h' : 'v';
    if (G.lock === 'v' && G.top <= 0 && G.dy > 0 && !ptr.classList.contains('go')) {
      const k = Math.min(1, G.dy / 110);
      ptr.classList.remove('back'); ptr.innerHTML = PTR_ICON[document.body.dataset.sport] || PTR_ICON.nfl;
      ptr.style.opacity = k; ptr.style.transform = `translateY(${Math.min(G.dy * .45, 52) - 40}px) rotate(${G.dy * 3}deg)`;
    }
    if (G.lock === 'h') {
      if (G.tgt.closest('.scroll-x,.wpg') && !(mode === 'sheet' && G.x < 30)) { G.lock = 'x'; return; }
      if (mode === 'sheet') { if (G.dx > 0) { e.preventDefault(); const sh = $('#sheet'); sh.style.transition = 'none'; sh.style.transform = `translateX(${G.dx}px)`; } }
      else { const el = G.tgt.closest('.cal') ? G.tgt.closest('.cal').querySelector('.cal-g') : $('#view'); G.el = el; el.style.transition = 'none'; el.style.transform = `translateX(${G.dx * .25}px)`; el.style.opacity = 1 - Math.min(.5, Math.abs(G.dx) / 600); }
    }
  }, { passive: false });
  const end = () => {
    if (!G) return; const g = G; G = null; const fast = Date.now() - g.t < 500;
    if (g.lock === 'v' && g.top <= 0 && g.dy > 0 && !ptr.classList.contains('go')) {
      if (g.dy > 110) {
        ptr.classList.add('go'); ptr.style.transform = 'translateY(12px)'; ptr.style.opacity = 1;
        delete memo.nflnow; Promise.resolve(refresh(true)).finally(() => { ptr.classList.add('back'); ptr.classList.remove('go'); ptr.style.opacity = 0; ptr.style.transform = 'translateY(-40px)'; });
      } else { ptr.classList.add('back'); ptr.style.opacity = 0; ptr.style.transform = 'translateY(-40px)'; }
    }
    if (g.lock !== 'h') return;
    const go = Math.abs(g.dx) > 110 || (fast && Math.abs(g.dx) > 60);
    if (mode === 'sheet') {
      const sh = $('#sheet');
      if (g.dx > 0 && go) { sh.style.transition = ''; sh.style.transform = ''; closeSheet(); }
      else { sh.style.transition = 'transform .2s ease-out'; sh.style.transform = ''; setTimeout(() => { sh.style.transition = ''; }, 220); }
      return;
    }
    const el = g.el; if (el) { el.style.transition = 'transform .2s ease-out,opacity .2s'; el.style.transform = ''; el.style.opacity = ''; setTimeout(() => { el.style.transition = ''; }, 220); }
    if (!go) return;
    if (g.tgt.closest('.cal')) { shiftMonth(g.dx < 0 ? 1 : -1); return; }
    const to = g.dx < 0 ? 'nhl' : 'nfl'; if (to === S.tab) return;
    const v = $('#view'); v.classList.remove('slide-l', 'slide-r'); void v.offsetWidth; v.classList.add(g.dx < 0 ? 'slide-l' : 'slide-r');
    setTab(to);
  };
  scroller.addEventListener('touchend', end); scroller.addEventListener('touchcancel', () => { G = null; ptr.classList.add('back'); ptr.style.opacity = 0; });
}
gestures($('#scroller'), $('#ptrMain'), 'main');
gestures($('#shScroll'), $('#ptrSheet'), 'sheet');
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('.wpg')) wpScrub(e); });
document.addEventListener('pointermove', e => { if (e.target.closest && e.target.closest('.wpg') && (e.buttons || e.pointerType !== 'mouse')) wpScrub(e); });
document.addEventListener('pointerup', wpScrubEnd);
document.addEventListener('pointercancel', wpScrubEnd);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheetMode) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
window.addEventListener('online', () => refresh(true));

applyIce();
$('#nhlTabLbl').textContent = nhlName();
setTab(S.tab === 'nhl' ? 'nhl' : 'nfl');
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
