<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forecheck</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1711">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forecheck">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: one column, phone-first. Sticky scoreboard header, fixed tab bar, full-screen game sheet.
   Football = night game on turf (always dark). Hockey = fresh ice (light) / arena (dark). */
:root{
  --f-disp:"Big Shoulders Display","Barlow Condensed",Impact,"Arial Narrow",sans-serif;
  --f-body:"Barlow",-apple-system,system-ui,"Segoe UI",sans-serif;
  --f-num:"Barlow Condensed","Barlow",-apple-system,system-ui,sans-serif;
  --bg:#0b1711;--bg2:#0f1f17;--card:#132a1e;--card2:#1a3527;--line:rgba(232,242,230,.12);
  --fg:#eef3ec;--muted:#97ab9c;--accent:#e9c35a;--accent-ink:#1d1704;--live:#ff5d50;--good:#5fd394;--warn:#f1b44c;
  --blue:#62b0ff;--chalk:#f3f6ee;--ice:#f4f8fb;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 26px rgba(0,0,0,.32);
  color-scheme:dark;
}
body[data-sport="nhl"]{
  --bg:#e7eef4;--bg2:#dde7ef;--card:#ffffff;--card2:#f0f5f9;--line:rgba(14,40,64,.13);
  --fg:#0c1d2b;--muted:#566a7b;--accent:#c8102e;--accent-ink:#ffffff;--live:#d0142f;--good:#16834b;--warn:#b26b00;
  --blue:#1d4f91;--chalk:#ffffff;--ice:#f6fafd;--shadow:0 1px 2px rgba(14,40,64,.08),0 8px 20px rgba(14,40,64,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  body[data-sport="nhl"]{
    --bg:#0a1119;--bg2:#0e1822;--card:#131e2a;--card2:#192736;--line:rgba(214,232,250,.11);
    --fg:#e7eff6;--muted:#8fa4b6;--accent:#ff4d5e;--accent-ink:#ffffff;--live:#ff4d5e;--good:#5fd394;--warn:#f1b44c;
    --blue:#71a7ff;--chalk:#dfe9f2;--ice:#dfe9f2;--shadow:0 10px 26px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.42 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;transition:background-color .25s}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
a{color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:var(--bg2);border-bottom:1px solid var(--line)}
body[data-sport="nfl"] .top{background:repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 30px,transparent 30px 60px),var(--bg2)}
body[data-sport="nhl"] .top{background:linear-gradient(90deg,transparent calc(50% - 1.5px),rgba(200,16,46,.28) calc(50% - 1.5px) calc(50% + 1.5px),transparent calc(50% + 1.5px)),linear-gradient(90deg,transparent 22%,rgba(29,79,145,.16) 22% calc(22% + 3px),transparent calc(22% + 3px) calc(78% - 3px),rgba(29,79,145,.16) calc(78% - 3px) 78%,transparent 78%),var(--bg2)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{font:900 24px/1 var(--f-disp);letter-spacing:.035em;text-transform:uppercase;margin:0}
.mark b{color:var(--accent);font-weight:900}
.updated{margin-left:auto;font:600 12px var(--f-num);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--live);box-shadow:0 0 0 0 var(--live);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 70%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg);background:var(--card2);border:1px solid var(--line)}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- main ---------- */
main{max-width:760px;margin:0 auto;padding-top:14px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px -4px}
.eyebrow{font:700 12px/1.2 var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.eyebrow.live{color:var(--live)}
.list{display:grid;gap:10px}
@media (min-width:640px){.list{grid-template-columns:1fr 1fr}}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--card);border-radius:14px;border:1px dashed var(--line)}
.err{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--live) 14%,var(--card));border:1px solid color-mix(in srgb,var(--live) 40%,transparent);font-size:14px}

/* nav (week / day) */
.nav{display:flex;align-items:center;gap:8px}
.nav .lbl{flex:1;text-align:center;font:800 20px/1 var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.nav .lbl small{display:block;font:600 12px var(--f-num);letter-spacing:.08em;color:var(--muted);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font:700 13px var(--f-num);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.pill svg{width:14px;height:14px}
.byes{font-size:13px;color:var(--muted);text-align:center;margin-top:-4px}

/* ---------- game card ---------- */
.game{background:var(--card);border-radius:14px;padding:11px 13px 12px;box-shadow:var(--shadow);display:grid;gap:7px;text-align:left;width:100%;border:1px solid var(--line);min-width:0}
.game.fav{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.g-top{display:flex;align-items:center;gap:8px;min-height:20px}
.st{font:700 13px var(--f-num);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.st.in{color:var(--live)}
.livetag{display:inline-flex;align-items:center;gap:5px;font:800 11px var(--f-num);letter-spacing:.12em;color:#fff;background:var(--live);border-radius:4px;padding:2px 6px}
.g-watch{display:flex;gap:5px;flex-wrap:wrap;min-width:0;padding-top:7px;border-top:1px solid var(--line)}
.sit+.g-watch{border-top:0;padding-top:0}
.tr{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px}
.tr.lose{opacity:.55}
.lg{width:30px;height:30px;object-fit:contain;display:block}
.tn{display:flex;align-items:baseline;gap:7px;min-width:0}
.ab{font:800 21px/1 var(--f-disp);letter-spacing:.03em}
.nm{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec{font-family:var(--f-num);opacity:.85}
.sc{font:800 30px/1 var(--f-disp);font-variant-numeric:tabular-nums;min-width:1.6ch;text-align:right}
.star{color:var(--accent);font-size:13px;line-height:1}
.poss{width:9px;height:6px;border-radius:50%;background:#a0582a;border:1px solid #f3e3d2;align-self:center}
.sit{display:grid;gap:5px;padding-top:7px;border-top:1px solid var(--line)}
.sit-line{display:flex;align-items:center;gap:8px;font:600 13px var(--f-num);letter-spacing:.03em;flex-wrap:wrap}
.rz{color:#fff;background:var(--live);border-radius:4px;padding:0 5px;font-weight:800;letter-spacing:.08em;font-size:11px}
.lastplay{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini{position:relative;height:16px;border-radius:4px;background:repeating-linear-gradient(90deg,#1f6e3c 0 10%,#22763f 10% 20%);overflow:hidden}
.mini .ez{position:absolute;top:0;bottom:0;width:6%}
.mini .los{position:absolute;top:0;bottom:0;width:2px;background:var(--blue)}
.mini .fd{position:absolute;top:0;bottom:0;width:2px;background:#f3d23b}
.mini .ball{position:absolute;top:50%;width:11px;height:7px;margin:-3.5px 0 0 -5.5px;border-radius:50%;background:#8b4a20;border:1px solid #f6e9dc}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font:700 12px/1.3 var(--f-num);letter-spacing:.03em;white-space:nowrap}
.chip .lng{font-size:10px;opacity:.7;letter-spacing:.08em}
.chip.stream{border-style:dashed}
.chip svg{width:10px;height:10px}
.chip.mine{background:color-mix(in srgb,var(--accent) 20%,var(--card2));border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--fg);padding:1px 6px;font-size:10px;letter-spacing:.08em}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:14px 16px 16px;color:#fff;background:linear-gradient(140deg,var(--tc) 0%,color-mix(in srgb,var(--tc) 62%,#000) 100%);box-shadow:var(--shadow);display:grid;gap:10px;text-align:left;width:100%}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 2px,transparent 2px 14px);pointer-events:none}
.hero .wm{position:absolute;right:-28px;top:-18px;width:150px;height:150px;opacity:.13;pointer-events:none}
.hero-eb{font:800 12px var(--f-num);letter-spacing:.14em;text-transform:uppercase;opacity:.9;display:flex;gap:8px;align-items:center;position:relative;z-index:1}
.hero-eb .livetag{background:#fff;color:var(--tc)}
.hero-m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;position:relative;z-index:1}
.hero-t{display:flex;align-items:center;gap:8px;min-width:0}
.hero-t.h{justify-content:flex-end}
.hero-t img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.hero-t .ab{font-size:28px}
.hero-sc{font:900 46px/1 var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.02em;display:flex;gap:10px;align-items:center}
.hero-sc .vs{font-size:16px;opacity:.7;font-weight:800;letter-spacing:.1em}
.hero-sc .l{opacity:.55}
.hero-st{font:700 15px var(--f-num);letter-spacing:.04em;text-transform:uppercase;text-align:center;position:relative;z-index:1}
.hero-sub{font-size:14px;opacity:.92;text-align:center;position:relative;z-index:1}
.hero .chips{justify-content:center;position:relative;z-index:1}
.hero .chip{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff}
.hero .mini{position:relative;z-index:1}
.hero .lastplay{color:rgba(255,255,255,.85);text-align:center}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{display:grid;justify-items:center;gap:2px;padding:8px 0 7px;color:var(--muted);font:700 11px var(--f-num);letter-spacing:.1em;text-transform:uppercase}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"] svg{color:var(--accent)}

/* ---------- sheet (game detail / settings) ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sh-top{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:var(--bg2);border-bottom:1px solid var(--line)}
.sh-top .top-in{padding-block:8px}
.sh-title{font:800 18px/1 var(--f-disp);letter-spacing:.05em;text-transform:uppercase;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{max-width:760px;margin:0 auto;padding-top:14px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.panel{background:var(--card);border-radius:14px;padding:13px 14px;box-shadow:var(--shadow);border:1px solid var(--line);display:grid;gap:10px;min-width:0}
.panel h3{margin:0;font:700 12px/1.2 var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.panel h3 .r{margin-left:auto;letter-spacing:.04em;text-transform:none;font-weight:600}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0}
svg text{font-family:var(--f-num)}

/* big detail scoreboard */
.dh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.dh-t{display:grid;justify-items:center;gap:4px;min-width:0}
.dh-t img{width:52px;height:52px;object-fit:contain}
.dh-t .ab{font-size:24px}
.dh-t .rec{font-size:13px;color:var(--muted)}
.dh-sc{font:900 50px/1 var(--f-disp);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:12px}
.dh-sc .l{opacity:.45}
.dh-mid{display:grid;justify-items:center;gap:6px}
.ls{width:100%;border-collapse:collapse;font:600 14px var(--f-num);font-variant-numeric:tabular-nums}
.ls th,.ls td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--line)}
.ls th{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.ls td:first-child,.ls th:first-child{text-align:left}
.ls td:last-child{font-weight:800}

/* segmented control */
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 6px;border-radius:7px;font:700 12px var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* compare bars */
.cmp{display:grid;gap:9px}
.cmp-r{display:grid;gap:4px}
.cmp-v{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:8px;font:700 15px var(--f-num);font-variant-numeric:tabular-nums}
.cmp-v span:nth-child(2){font:600 12px var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.cmp-b{display:flex;gap:3px;height:6px}
.cmp-b i{display:block;border-radius:3px;min-width:3px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font:500 14px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{font:700 11px var(--f-num);letter-spacing:.08em;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.tbl td{text-align:right;padding:6px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td:first-child{font-family:var(--f-body);font-weight:600;font-size:14px;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.tbl tr.me td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.cat{font:700 12px var(--f-num);letter-spacing:.1em;text-transform:uppercase;margin:6px 0 0;color:var(--muted)}

/* drive chart */
.drives{display:grid;gap:7px}
.dr{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.dr-ab{font:800 14px var(--f-disp);letter-spacing:.04em}
.dr-track{position:relative;height:18px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--card2) 0 10%,color-mix(in srgb,var(--card2) 70%,var(--line)) 10% 20%)}
.dr-bar{position:absolute;top:3px;bottom:3px;border-radius:3px;min-width:4px}
.dr-meta{grid-column:2;display:flex;gap:8px;font:600 12px var(--f-num);color:var(--muted);letter-spacing:.03em;margin-top:-3px}
.dr-res{font-weight:800;color:var(--fg)}
.dr-res.score{color:var(--good)}
.dr-res.bad{color:var(--live)}

/* plays / goals */
.plays{display:grid;gap:0}
.play{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.play:last-child{border-bottom:0}
.play .t{font:700 12px var(--f-num);color:var(--muted);letter-spacing:.04em;white-space:nowrap;padding-top:2px;min-width:54px}
.play .tag{display:inline-block;font:800 11px var(--f-num);letter-spacing:.08em;padding:0 5px;border-radius:4px;color:#fff;margin-right:6px}

/* watch */
.watch{display:grid;gap:8px}
.wrow{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:start}
.wrow .k{font:700 11px var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:4px}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:12px;font:600 12px var(--f-num);color:var(--muted);letter-spacing:.03em}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}

/* ---------- fantasy ---------- */
.fx-head{display:flex;align-items:center;gap:8px}
.fx-head .lg-name{font:800 20px/1 var(--f-disp);letter-spacing:.04em;text-transform:uppercase}
.fx-head .src{margin-left:auto}
.fx-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.fx-tm{min-width:0}
.fx-tm.r{text-align:right}
.fx-tm .n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-tm .p{font:900 38px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.fx-tm .pj{font:600 12px var(--f-num);color:var(--muted);letter-spacing:.04em}
.fx-mid{font:800 12px var(--f-num);letter-spacing:.14em;color:var(--muted)}
.fx-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px}
.fx-bar i{display:block}
.fx-odds{display:flex;justify-content:space-between;font:700 12px var(--f-num);letter-spacing:.06em;color:var(--muted);margin-top:-4px}
.pl{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.slot{font:800 11px var(--f-num);letter-spacing:.06em;color:var(--muted);text-align:center;background:var(--card2);border-radius:5px;padding:3px 0}
.pn{min-width:0}
.pn .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn .m{font:600 12px var(--f-num);color:var(--muted);letter-spacing:.03em;display:flex;gap:6px;flex-wrap:wrap}
.pn .m .in{color:var(--live)}
.pn .m .inj{color:var(--warn);font-weight:800}
.pp{text-align:right}
.pp .v{font:800 20px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.pp .j{font:600 11px var(--f-num);color:var(--muted)}
.bench{opacity:.72}
.mu{display:grid;grid-template-columns:1fr auto auto auto 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mu:last-child{border-bottom:0}
.mu .a{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<script>
'use strict';
/* =====================================================================
   Forecheck: personal NFL + NHL live scores, game visuals, where to
   watch in Montréal, and live fantasy (Sleeper + CBS).
   Data: ESPN public site API, Sleeper public API, CBS Fantasy API
   (with the user's own token). Personal settings stay on this device.
   ===================================================================== */
const TZ = 'America/Toronto';
const NFL_TEAMS = 'ARI ATL BAL BUF CAR CHI CIN CLE DAL DEN DET GB HOU IND JAX KC LAC LAR LV MIA MIN NE NO NYG NYJ PHI PIT SEA SF TB TEN WSH'.split(' ');
const NHL_TEAMS = 'ANA BOS BUF CAR CBJ CGY CHI COL DAL DET EDM FLA LA MIN MTL NJ NSH NYI NYR OTT PHI PIT SEA SJ STL TB TOR UTA VAN VGK WPG WSH'.split(' ');
const PATH = { nfl: 'football/nfl', nhl: 'hockey/nhl' };
const CBS_TOKEN_RE = /token["']?\s*[:=]\s*["']([A-Za-z0-9_\-.]{20,})["']/;

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('fc_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fc_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('fc_' + k); } catch (e) {} }
};
const DEFAULTS = { favNFL: 'MIN', favNHL: 'MTL', sleeperLeague: '', sleeperRoster: '', cbsToken: '', cbsTeam: '' };
let CFG = Object.assign({}, DEFAULTS, LS.get('cfg', {}));
const saveCfg = () => LS.set('cfg', CFG);

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

async function getJSON(url, timeout = 15000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), timeout);
  try {
    const r = await fetch(url, { signal: c.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    try { return JSON.parse(txt); } catch (e) { throw new Error(txt.slice(0, 120) || 'Bad response'); }
  } catch (e) { if (e.name === 'AbortError') throw new Error('Timed out'); throw e; }
  finally { clearTimeout(t); }
}
const espn = (sp, p) => getJSON(`https://site.api.espn.com/apis/site/v2/sports/${PATH[sp]}/${p}`);
const memo = {};
async function cached(key, ms, fn) {
  const m = memo[key]; if (m && Date.now() - m.t < ms) return m.v;
  const v = await fn(); memo[key] = { t: Date.now(), v }; return v;
}

/* time */
function et(d) {
  const p = {}; new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23', month: 'numeric', day: 'numeric' }).formatToParts(d).forEach(x => p[x.type] = x.value);
  return { wd: p.weekday, h: +p.hour % 24, m: +p.minute, mon: +p.month, day: +p.day };
}
const ymd = d => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d).replace(/-/g, '');
const fmtTime = d => d.toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' }).replace(/\./g, '').toUpperCase();
const fmtDay = d => d.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' }).replace(/\./g, '');
const isToday = d => ymd(d) === ymd(new Date());
function dayWord(d) { const tom = new Date(Date.now() + 864e5); return isToday(d) ? 'Today' : ymd(d) === ymd(tom) ? 'Tomorrow' : fmtDay(d); }
function whenLabel(d) { const tom = new Date(Date.now() + 864e5); return (isToday(d) ? 'Today' : ymd(d) === ymd(tom) ? 'Tomorrow' : fmtDay(d)) + ' · ' + fmtTime(d); }
const qLab = n => (+n > 4 ? 'OT' : 'Q' + (n || ''));
const onInk = c => lum(c) > .36 ? '#10161c' : '#ffffff';
const secs = s => { const m = String(s || '').match(/(\d+):(\d+)/); return m ? +m[1] * 60 + +m[2] : 0; };

/* colour */
function lum(hex) { const n = parseInt(String(hex).replace('#', '').padEnd(6, '0').slice(0, 6), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }).reduce((a, v, i) => a + v * [.2126, .7152, .0722][i], 0); }
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const cssVar = n => getComputedStyle(document.body).getPropertyValue(n).trim();
function teamInk(t) { // a team colour that reads on the current card colour
  const bg = cssVar('--card') || '#132a1e'; const a = t.color, b = t.alt;
  if (contrast(a, bg) >= 2) return a; return contrast(b, bg) > contrast(a, bg) ? b : a;
}
function pairInk(g) { // keep the two teams distinguishable
  let h = teamInk(g.home), a = teamInk(g.away);
  if (contrast(h, a) < 1.35) { const alt = g.away.alt; if (contrast(alt, h) > contrast(a, h)) a = alt; }
  return { h, a };
}
function heroColor(t) { // team colour that keeps white text readable
  for (const c of [t.color, t.alt]) if (c && contrast(c, '#ffffff') >= 3.6) return c;
  return '#1d2733';
}

/* ---------- ESPN normalising ---------- */
function mkTeam(sp, c) {
  const t = c.team || {}; const abbr = t.abbreviation || '';
  let logo = t.logo || (t.logos && t.logos[0] && t.logos[0].href) || `https://a.espncdn.com/i/teamlogos/${sp}/500/${abbr.toLowerCase()}.png`;
  const logoDark = logo.includes('/500/') ? logo.replace('/500/', '/500-dark/') : logo;
  const recs = c.records || c.record || [];
  const rec = Array.isArray(recs) ? ((recs.find(r => r.type === 'total') || recs[0] || {}).summary || '') : '';
  let score = c.score; if (score && typeof score === 'object') score = score.displayValue;
  return { id: String(t.id || c.id || ''), abbr, name: t.shortDisplayName || t.name || abbr, full: t.displayName || '', color: '#' + (t.color || '55606a'), alt: '#' + (t.alternateColor || '9aa4ad'), logo, logoDark, score: score ?? '', rec, winner: !!c.winner, ls: c.linescores || [], stats: c.statistics || [] };
}
function mkGame(sp, ev) {
  const c = ev.competitions[0]; const st = c.status || ev.status;
  const H = c.competitors.find(x => x.homeAway === 'home'), A = c.competitors.find(x => x.homeAway === 'away');
  const us = []; (c.broadcasts || []).forEach(b => { (b.names || []).forEach(n => us.push(n)); if (b.media && b.media.shortName) us.push(b.media.shortName); });
  const season = ev.season || {};
  return {
    sp, id: String(ev.id || c.id), date: new Date(ev.date || c.date), state: st.type.state, detail: st.type.shortDetail || st.type.detail || '', period: st.period, clock: st.displayClock,
    home: mkTeam(sp, H), away: mkTeam(sp, A), sit: c.situation || null, us: [...new Set(us)], venue: c.venue && c.venue.fullName, note: (c.notes && c.notes[0] && c.notes[0].headline) || '',
    stype: season.type || (ev.seasonType && ev.seasonType.type) || 2, week: ev.week && ev.week.number
  };
}
const isFav = (sp, abbr) => abbr && abbr === (sp === 'nfl' ? CFG.favNFL : CFG.favNHL);
const hasFav = g => isFav(g.sp, g.home.abbr) || isFav(g.sp, g.away.abbr);

/* ---------- where to watch in Montréal ---------- */
const TV = (name, lang, note) => ({ name, lang, note, kind: 'tv' });
const ST = (name, lang, note) => ({ name, lang, note, kind: 'stream' });
function watchNFL(g) {
  const { wd, h, mon } = et(g.date); const out = []; let note = '', link = 'https://www.tsn.ca/nfl/article/nfl-on-tsnctv-broadcast-schedule-3';
  const post = +g.stype === 3;
  const christmas = mon === 12 && et(g.date).day === 25;
  if (post) { out.push(TV('TSN', 'EN'), TV('CTV', 'EN'), TV('RDS', 'FR')); note = 'Playoff games are on TSN and CTV, with RDS in French.'; }
  else if (christmas) { out.push(TV('TSN', 'EN'), TV('CTV', 'EN'), TV('RDS', 'FR')); note = 'All Christmas games air on TSN and CTV in Canada.'; }
  else if (wd === 'Thu' && h >= 19) { out.push(TV('TSN', 'EN'), TV('CTV2', 'EN'), TV('RDS2', 'FR')); note = 'Thursday Night Football. Prime Video doesn’t carry it in Canada.'; }
  else if (wd === 'Sun' && h >= 19) { out.push(TV('TSN', 'EN'), TV('CTV', 'EN'), TV('RDS', 'FR')); note = 'Sunday Night Football.'; }
  else if (wd === 'Mon') { out.push(TV('TSN', 'EN'), TV('CTV2', 'EN'), TV('RDS2', 'FR')); note = 'Monday Night Football.'; }
  else if (wd === 'Sun' && h < 12) { out.push(ST('TSN app', 'EN', 'TSN Premium')); note = 'International morning games are mostly on TSN Premium in the TSN app.'; }
  else if (wd === 'Sun') { out.push(TV('CTV', 'EN', 'maybe'), TV('TSN', 'EN', 'maybe'), TV('RDS', 'FR', 'maybe')); note = 'Sunday afternoon picks change weekly. Bell carries most games across CTV, TSN1–5 and RDS; check the weekly list.'; }
  else { out.push(TV('TSN', 'EN'), TV('CTV', 'EN'), TV('RDS', 'FR', 'likely')); note = 'Stand-alone games usually air on TSN and CTV.'; }
  out.push(ST('DAZN', 'EN', 'every game'));
  if (out.some(x => x.name.startsWith('TSN'))) out.push(ST('TSN app / Crave', 'EN'));
  if (out.some(x => x.name.startsWith('RDS'))) out.push(ST('RDS app', 'FR'));
  return { items: out, note, link, linkText: 'TSN/CTV weekly schedule' };
}
const CAN_NHL = ['MTL', 'TOR', 'OTT', 'WPG', 'EDM', 'CGY', 'VAN'];
function watchNHL(g) {
  const { wd } = et(g.date); const T = [g.home.abbr, g.away.abbr]; const out = []; let note = '', link = '', linkText = '';
  if (T.includes('MTL')) {
    link = 'https://www.nhl.com/canadiens/schedule'; linkText = 'Canadiens broadcast schedule';
    if (wd === 'Sat') { out.push(TV('Sportsnet', 'EN', 'Saturday Night Hockey'), TV('TVA Sports', 'FR'), ST('Sportsnet+', 'EN'), ST('TVA Sports Direct', 'FR')); note = 'Saturday Habs games are usually national. If not, it’s TSN2 and RDS.'; }
    else if (wd === 'Wed') { out.push(ST('Prime Video', 'EN/FR', 'if national'), TV('TSN2', 'EN'), TV('RDS', 'FR')); note = 'National Wednesday games are exclusive to Prime Video. Otherwise TSN2 and RDS.'; }
    else if (wd === 'Mon') { out.push(ST('Sportsnet+', 'EN', 'if Monday Night Hockey'), TV('TSN2', 'EN'), TV('RDS', 'FR')); note = 'Six Habs Monday games stream only on Sportsnet+. The rest are on TSN2 and RDS.'; }
    else { out.push(TV('TSN2', 'EN'), TV('RDS', 'FR'), ST('TSN app', 'EN'), ST('RDS app', 'FR')); note = 'Regional Habs game. A few are national instead (Sportsnet / TVA Sports).'; }
  } else if (T.includes('OTT')) {
    out.push(TV('TSN5', 'EN'), TV('RDS', 'FR'), ST('TSN app', 'EN')); note = 'Senators regional games are available in Québec.';
    if (wd === 'Sat') { out.unshift(TV('Sportsnet', 'EN', 'if national')); }
  } else if (T.some(t => CAN_NHL.includes(t))) {
    if (wd === 'Sat') { out.push(TV('Sportsnet', 'EN', 'Saturday Night Hockey'), TV('TVA Sports', 'FR', 'maybe')); note = 'Saturday doubleheaders feature Canadian teams.'; }
    else if (wd === 'Wed') { out.push(ST('Prime Video', 'EN/FR', 'if national'), ST('Sportsnet+ Premium', 'EN')); note = 'National Wednesday games are on Prime Video. Regional ones are out of market here.'; }
    else { out.push(TV('Sportsnet', 'EN', 'if national'), ST('Sportsnet+ Premium', 'EN', 'out of market')); note = 'Regional games for other Canadian teams are blacked out in Montréal.'; }
  } else {
    out.push(ST('Sportsnet+ Premium', 'EN', 'out of market'), TV('NHL Centre Ice', 'EN')); note = 'ESPN, TNT and ESPN+ aren’t available in Canada. Some US games are picked up by Sportsnet.';
  }
  return { items: out, note, link, linkText };
}
const watchFor = g => g.sp === 'nfl' ? watchNFL(g) : watchNHL(g);
const PLAY_SVG = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>';
function chip(x) { return `<span class="chip${x.kind === 'stream' ? ' stream' : ''}">${x.kind === 'stream' ? PLAY_SVG : ''}${esc(x.name)}${x.lang ? ` <span class="lng">${esc(x.lang)}</span>` : ''}</span>`; }
function watchChips(g, max = 99) { return watchFor(g).items.slice(0, max).map(chip).join(''); }

/* ---------- shared bits ---------- */
const darkUI = () => g_sport() === 'nfl' || matchMedia('(prefers-color-scheme: dark)').matches;
function g_sport() { return document.body.dataset.sport; }
const FB = "this.onerror=null;this.src=this.dataset.fb";
function logoImg(t, cls = 'lg', forceDark) { const d = forceDark || darkUI(); return `<img class="${cls}" src="${esc(d ? t.logoDark : t.logo)}" data-fb="${esc(t.logo)}" onerror="${FB}" alt="" decoding="async">`; }
const heroLogo = t => `<img src="${esc(t.logoDark)}" data-fb="${esc(t.logo)}" onerror="${FB}" alt="">`;
function statusHTML(g) {
  if (g.state === 'in') return `<span class="livetag">LIVE</span><span class="st in">${esc(g.detail)}</span>`;
  if (g.state === 'pre') return `<span class="st">${esc(whenLabel(g.date))}</span>`;
  return `<span class="st">${esc(g.detail || 'Final')}</span>`;
}
function ownFromText(txt, offAbbr) {
  const m = String(txt || '').trim().match(/^([A-Z]{2,4})?\s*(\d{1,2})$/); if (!m) return null; const n = +m[2];
  if (n === 50) return 50; if (!m[1]) return null; return m[1] === offAbbr ? n : 100 - n;
}
function nflSit(g) { // normalise the live situation: offence always drives toward the right
  const s = g.sit; if (!s || g.state !== 'in') return null;
  const offId = String(s.possession || ''); const off = offId === g.home.id ? g.home : offId === g.away.id ? g.away : null; if (!off) return { text: s.lastPlay && s.lastPlay.text };
  const def = off === g.home ? g.away : g.home;
  const own = ownFromText(s.possessionText, off.abbr);
  return { off, def, own, down: s.down, dist: s.distance, dd: s.downDistanceText || s.shortDownDistanceText || '', rz: !!s.isRedZone, text: s.lastPlay && s.lastPlay.text, goal: /goal/i.test(s.downDistanceText || '') };
}
function miniField(si, g) {
  if (!si || si.own == null) return '';
  const ink = pairInk(g); const oc = si.off === g.home ? ink.h : ink.a, dc = si.off === g.home ? ink.a : ink.h;
  const x = v => (6 + v * .88).toFixed(2) + '%';
  const fd = si.dist && !si.goal && si.own + si.dist < 100 ? `<i class="fd" style="left:${x(si.own + si.dist)}"></i>` : '';
  return `<div class="mini" aria-hidden="true"><i class="ez" style="left:0;background:${oc}"></i><i class="ez" style="right:0;background:${dc}"></i><i class="los" style="left:${x(si.own)}"></i>${fd}<i class="ball" style="left:${x(si.own)}"></i></div>`;
}

/* ---------- game card ---------- */
function teamRow(g, t) {
  const done = g.state === 'post'; const lose = done && !t.winner && (g.home.winner || g.away.winner);
  const si = g.sp === 'nfl' ? nflSit(g) : null; const poss = si && si.off === t;
  return `<div class="tr${lose ? ' lose' : ''}">${logoImg(t)}<div class="tn"><span class="ab">${esc(t.abbr)}</span>${isFav(g.sp, t.abbr) ? '<span class="star" aria-label="Favourite">★</span>' : ''}${poss ? '<span class="poss" title="Has the ball"></span>' : ''}<span class="nm">${esc(t.name)} <span class="rec">${esc(t.rec)}</span></span></div><div class="sc">${g.state === 'pre' ? '' : esc(t.score)}</div></div>`;
}
function gameCard(g) {
  let sit = '';
  if (g.sp === 'nfl' && g.state === 'in') {
    const si = nflSit(g);

}

/* =====================================================================
   REFRESH LOOP + EVENTS
   ===================================================================== */
async function refresh(force) {
  clearTimeout(S.timer);
  if (document.hidden && !force) { S.timer = setTimeout(refresh, 30e3); return; }
  if (S.busy && !force) return; S.busy = true; $('#refreshBtn').classList.add('spin');
  let live = false;
  try {
    if (S.sheetMode === 'game') live = await loadDetail();
    else if (S.sheetMode === 'settings') live = S.live;
    else if (S.tab === 'nfl') live = await loadNFL();
    else if (S.tab === 'nhl') live = await loadNHL();
    else live = await loadFx();
    setUpdated(live);
  } catch (e) {
    const msg = navigator.onLine === false ? 'You’re offline. Scores will refresh when you reconnect.' : 'Couldn’t load scores (' + e.message + '). Retrying shortly.';
    if (S.sheetMode === 'game') toast(msg); else if (!S.sheetMode) { const v = $('#view'); if (!v.querySelector('.game,.panel,.hero')) v.innerHTML = `<div class="err">${esc(msg)}</div>`; else toast(msg); }
  } finally {
    S.busy = false; $('#refreshBtn').classList.remove('spin');
    S.timer = setTimeout(refresh, live ? 15e3 : 60e3);
  }
}
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) { const [sp, id] = o.dataset.open.split(':'); openGame(sp, id); return; }
  const t = e.target.closest('[data-tab]'); if (t) { if (S.sheetMode) closeSheet(); setTab(t.dataset.tab); return; }
  const w = e.target.closest('[data-wk]'); if (w) { shiftWeek(+w.dataset.wk); return; }
  const d = e.target.closest('[data-day]'); if (d) { shiftDay(+d.dataset.day); return; }
  if (e.target.closest('.nav .lbl u')) { if (S.tab === 'nfl') S.nfl.q = null; else S.nhl.date = null; refresh(true); return; }
  const p = e.target.closest('[data-ptab]'); if (p && S.detail) { S.detail.tab = p.dataset.ptab; const g = S.detail.g, s = S.detail.s; const keep = $('#sheet').scrollTop; $('#shBody').innerHTML = S.detail.sp === 'nfl' ? nflDetail(g, s) : nhlDetail(g, s); $('#sheet').scrollTop = keep; return; }
  const f = e.target.closest('[data-fx]'); if (f) { const [k, v] = f.dataset.fx.split(':'); S.fx[k] = v; refresh(true); return; }
  if (e.target.closest('[data-settings]')) { openSettings(); return; }
});
$('#sheetBack').onclick = closeSheet;
$('#settingsBtn').onclick = openSettings;
$('#refreshBtn').onclick = () => { for (const k in memo) if (k === 'nflnow') delete memo[k]; refresh(true); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheetMode) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
window.addEventListener('online', () => refresh(true));
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { setSport(S.tab); refresh(true); });

setTab(['nfl', 'nhl', 'fx'].includes(S.tab) ? S.tab : 'nfl');
warmMine();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
