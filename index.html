<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forecheck</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Forecheck">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: iOS-style app shell. The page itself never scrolls (that is what triggers iOS's blurred
   top edge); only #view and the sheet body scroll. Grouped inset lists, hairline separators.
   Diegetic pieces: a TV score bug for football, an amber arena clock for hockey, a real field and rink. */
:root{
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --num:"Barlow Condensed","SF Pro Display",-apple-system,system-ui,sans-serif;
  --bg:#f2f2f7;--card:#ffffff;--card2:#f2f2f7;--fill:rgba(118,118,128,.12);--sep:rgba(60,60,67,.2);
  --fg:#000000;--fg2:rgba(60,60,67,.64);--fg3:rgba(60,60,67,.3);
  --red:#ff3b30;--green:#248a3d;--blue:#007aff;--amber:#ffb020;--bar:rgba(247,247,250,.97);
  --tint:#1f8a4c;--ice:#f3f7fa;--iceline:#c8d6e2;--clock:#0d0d0f;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#000000;--card:#1c1c1e;--card2:#2c2c2e;--fill:rgba(118,118,128,.24);--sep:rgba(84,84,88,.65);
  --fg:#ffffff;--fg2:rgba(235,235,245,.62);--fg3:rgba(235,235,245,.3);
  --red:#ff453a;--green:#30d158;--blue:#0a84ff;--bar:rgba(22,22,24,.97);
  --tint:#34c470;--ice:#18222d;--iceline:#2c3b4a;--clock:#000000;
  color-scheme:dark;
}}
body[data-sport="nhl"]{--tint:#c41230}
body[data-sport="fx"]{--tint:#5856d6}
@media (prefers-color-scheme:dark){body[data-sport="nhl"]{--tint:#ff5263}body[data-sport="fx"]{--tint:#8e8cff}}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--fg);font:15px/1.35 var(--ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
a{color:var(--blue);text-decoration:none}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.nav{flex:none;background:var(--bar);border-bottom:.5px solid var(--sep);padding-top:env(safe-area-inset-top,0px);z-index:5}
.nav-in{max-width:720px;margin:0 auto;height:46px;display:flex;align-items:center;gap:4px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.ttl{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:0 4px}
.ttl h1{margin:0;font:700 20px/1.1 var(--ui);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{font:500 12px/1.2 var(--ui);color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small u{color:var(--blue);text-decoration:none}
.chev{width:30px;height:36px;display:grid;place-items:center;color:var(--tint);flex:none}
.chev svg{width:12px;height:20px}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.upd{display:flex;align-items:center;gap:5px;font:500 12px var(--ui);color:var(--fg2);font-variant-numeric:tabular-nums;margin-right:4px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.dot.on{background:var(--red);animation:blink 1.6s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.ib{width:36px;height:36px;display:grid;place-items:center;color:var(--tint);border-radius:50%}
.ib svg{width:21px;height:21px}
.ib.busy{opacity:.4}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.wrap{max-width:720px;margin:0 auto;padding-top:10px;padding-bottom:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:4px}
.tabs{flex:none;background:var(--bar);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:50px}
.tab{display:grid;justify-items:center;align-content:center;gap:1px;color:var(--fg2);font:500 10px var(--ui)}
.tab svg{width:25px;height:25px}
.tab[aria-selected="true"]{color:var(--tint)}

/* ---------- grouped lists ---------- */
.gh{display:flex;align-items:baseline;gap:8px;margin:14px 16px 6px;font:400 13px var(--ui);color:var(--fg2);text-transform:uppercase;letter-spacing:.02em}
.gh:first-child{margin-top:4px}
.gh .r{margin-left:auto;text-transform:none;letter-spacing:0}
.gh.live{color:var(--red)}
.group{background:var(--card);border-radius:12px;overflow:hidden;min-width:0}
.group.pad{padding:12px 14px;display:grid;gap:10px}
.foot{margin:6px 16px 0;font:400 12.5px/1.35 var(--ui);color:var(--fg2)}
.empty{padding:22px 16px;text-align:center;color:var(--fg2);font-size:14px}
.err{padding:11px 14px;border-radius:12px;background:var(--card);color:var(--red);font-size:14px}

/* game row (Apple Sports-like) */
.gr{display:grid;grid-template-columns:1fr 62px;column-gap:12px;width:100%;padding:8px 14px 8px 14px;position:relative;align-items:center}
.gr+.gr::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
.gr:active{background:var(--fill)}
.ln{display:flex;align-items:center;gap:7px;height:24px;min-width:0}
.ln img{width:20px;height:20px;object-fit:contain;flex:none}
.ln .ab{font:700 18px/1 var(--num);letter-spacing:.01em}
.ln .rec{font:400 12px var(--ui);color:var(--fg2);white-space:nowrap}
.ln .sc{margin-left:auto;font:700 21px/1 var(--num);font-variant-numeric:tabular-nums}
.ln.lose .ab,.ln.lose .sc{color:var(--fg2)}
.ln.lose img{opacity:.6}
.star{color:var(--tint);font-size:11px}
.foot-ic{width:14px;height:9px;flex:none}
.gs{border-left:.5px solid var(--sep);align-self:stretch;display:flex;flex-direction:column;justify-content:center;align-items:center;font:600 13px/1.25 var(--ui);text-align:center;color:var(--fg)}
.gs span{font-weight:400;color:var(--fg2);font-variant-numeric:tabular-nums}
.gs .live{color:var(--red)}
.gs .live+span{color:var(--red);font-weight:600}
.gr-x{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:5px;font:500 12px var(--ui);color:var(--fg2);min-width:0}
.gr-x .gauge{flex:0 0 110px}
.gr-x .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rz{color:#fff;background:var(--red);border-radius:3px;padding:0 4px;font:700 10px/16px var(--ui);letter-spacing:.04em}
.tv{display:inline-flex;gap:4px;align-items:center}
.tv svg{width:13px;height:13px;flex:none}

/* chain gauge: a sliver of field */
.gauge{position:relative;height:8px;border-radius:2px;background:repeating-linear-gradient(90deg,#2f7d43 0 10%,#2a733d 10% 20%);overflow:hidden}
.gauge .ez{position:absolute;top:0;bottom:0;width:7%}
.gauge .los{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#5db1ff}
.gauge .fd{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#f6d32d}
.gauge .ball{position:absolute;top:50%;width:9px;height:6px;margin:-3px 0 0 -4.5px;border-radius:50%;background:#8b4a20;border:1px solid #fff}

/* ---------- score bug (diegetic broadcast graphic) ---------- */
.hero{display:grid;gap:8px;width:100%;background:var(--card);border-radius:14px;padding:10px}
.hero:active{opacity:.85}
.bug{display:grid;grid-template-columns:1fr 1fr auto;border-radius:9px;overflow:hidden;min-height:44px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.bt{display:flex;align-items:center;gap:6px;padding:0 9px;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 88%,#fff) 0%,var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000) 100%);min-width:0}
.bt+.bt{border-left:1px solid rgba(0,0,0,.25)}
.bt img{width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35));flex:none}
.bt .ab{font:800 20px/1 var(--num);letter-spacing:.03em;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.bt .bs{margin-left:auto;font:800 28px/1 var(--num);font-variant-numeric:tabular-nums;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.bt .bs small{font:600 13px var(--ui);opacity:.9;text-shadow:none}
.bt.lose .bs{opacity:.6}
.bt .foot-ic{width:16px;height:10px}
.bt.wide{grid-column:1/3}
.bt .bye{margin-left:auto;font:800 16px/1 var(--num);letter-spacing:.12em;opacity:.9}
.bc{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:66px;padding:0 8px;background:#111214;color:#fff;font:700 13px/1.15 var(--num);letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.bc .c2{font-size:17px;letter-spacing:.02em}
.bc.on .c1{color:#ff6b5e}
.bug.nhl .bc{background:var(--clock);min-width:72px}
.bug.nhl .bc .c2{color:var(--amber);font-size:22px;text-shadow:0 0 6px rgba(255,176,32,.55)}
.bug.nhl .bc .c1{color:#ffd27a}
.bug.nhl .bc.on .c1{color:#ff6b5e}
.bug.lg{min-height:58px;border-radius:11px}
.bug.lg .bt img{width:30px;height:30px}
.bug.lg .bt .ab{font-size:23px}
.bug.lg .bt .bs{font-size:36px}
.bug.lg .bc{min-width:80px}
.bug .sog{display:block;font:600 11px var(--ui);opacity:.85;text-shadow:none;letter-spacing:.02em}
.bt .stack{display:flex;flex-direction:column;line-height:1}
.under{display:grid;gap:6px;padding:0 2px}
.flag{display:flex;align-items:center;gap:8px;font:600 13px var(--ui)}
.flag b{background:#f6d32d;color:#111;border-radius:4px;padding:2px 6px;font:800 13px/1.2 var(--num);letter-spacing:.04em;text-transform:uppercase}
.under .play{font-size:13px;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.under .meta{font-size:13px;color:var(--fg2)}

/* chips (channels) */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;background:var(--fill);font:600 12px/1.3 var(--ui);white-space:nowrap}
.chip .lng{font-weight:500;color:var(--fg2);font-size:10.5px}
.chip svg{width:9px;height:9px;color:var(--fg2)}
.mine{display:inline-block;padding:0 4px;border-radius:4px;background:color-mix(in srgb,var(--tint) 18%,transparent);color:var(--tint);font:700 9.5px/15px var(--ui);letter-spacing:.04em;vertical-align:1px}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sh-nav .nav-in{gap:0}
.back{display:flex;align-items:center;gap:3px;color:var(--tint);font:400 17px var(--ui);padding:6px 4px;flex:none;min-width:84px}
.back svg{width:12px;height:20px}
.sh-title{flex:1;text-align:center;font:600 17px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-right{min-width:84px;display:flex;justify-content:flex-end;align-items:center;gap:6px}
.done{color:var(--tint);font:600 17px var(--ui);padding:6px 4px}

/* linescore + tables */
.ls{width:100%;border-collapse:collapse;font:600 14px var(--num);font-variant-numeric:tabular-nums}
.ls th,.ls td{padding:4px 5px;text-align:center}
.ls th{font:500 11px var(--ui);color:var(--fg2)}
.ls td:first-child,.ls th:first-child{text-align:left}
.ls td:last-child{font-weight:800}
.ls tr+tr td{border-top:.5px solid var(--sep)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;min-width:0}
.tbl{width:100%;border-collapse:collapse;font:500 14px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{font:500 11px var(--ui);color:var(--fg2);text-align:right;padding:2px 5px 4px}
.tbl td{text-align:right;padding:5px;border-top:.5px solid var(--sep)}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td:first-child{font:500 14px var(--ui);max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.tbl tr.me td{background:color-mix(in srgb,var(--tint) 9%,transparent)}
.cat{font:600 12px var(--ui);color:var(--fg2);margin:4px 0 -4px}
svg text{font-family:var(--num)}

/* segmented control */
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{flex:1;padding:5px 6px;border-radius:7px;font:500 13px var(--ui);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){.seg button[aria-pressed="true"]{background:#636366}}

/* compare bars */
.cmp{display:grid;gap:8px}
.cmp-v{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:8px;font:700 16px var(--num);font-variant-numeric:tabular-nums}
.cmp-v span:nth-child(2){font:400 12px var(--ui);color:var(--fg2);text-align:center}
.cmp-b{display:flex;gap:2px;height:4px;margin-top:3px}
.cmp-b i{display:block;border-radius:2px;min-width:2px}

/* drives */
.dr{display:grid;grid-template-columns:30px 1fr;gap:2px 8px;align-items:center;padding:4px 0}
.dr+.dr{border-top:.5px solid var(--sep)}
.dr-ab{font:700 14px var(--num)}
.dr-track{position:relative;height:12px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--fill) 0 10%,transparent 10% 20%)}
.dr-bar{position:absolute;top:2px;bottom:2px;border-radius:2px;min-width:3px}
.dr-meta{grid-column:2;display:flex;gap:8px;font:400 11.5px var(--ui);color:var(--fg2);white-space:nowrap;overflow:hidden}
.dr-res{font-weight:600;color:var(--fg)}
.dr-res.score{color:var(--green)}
.dr-res.bad{color:var(--red)}

/* plays */
.play{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:6px 0;font-size:13.5px}
.play+.play{border-top:.5px solid var(--sep)}
.play .t{font:600 12px var(--num);color:var(--fg2);letter-spacing:.02em;padding-top:1px}
.tag{display:inline-block;font:700 10.5px/16px var(--num);letter-spacing:.06em;padding:0 5px;border-radius:3px;margin-right:5px}

.legend{display:flex;flex-wrap:wrap;gap:10px;font:400 11.5px var(--ui);color:var(--fg2)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.sw{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- fantasy ---------- */
.mx{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.mx .t{min-width:0}
.mx .t.r{text-align:right}
.mx .nm{font:500 13px var(--ui);color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx .p{font:800 32px/1 var(--num);font-variant-numeric:tabular-nums}
.mx .pj{font:400 12px var(--ui);color:var(--fg2)}
.mx .vs{font:600 12px var(--ui);color:var(--fg3);padding-bottom:16px}
.wb{display:flex;height:4px;border-radius:2px;overflow:hidden;gap:2px}
.wb i{display:block}
.wbl{display:flex;justify-content:space-between;font:500 11.5px var(--ui);color:var(--fg2);margin-top:-6px}
.pl{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:6px 14px;position:relative}
.pl+.pl::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:.5px solid var(--sep)}
.slot{font:600 10.5px var(--ui);color:var(--fg2);text-align:center;letter-spacing:.02em}
.pn{min-width:0}
.pn .n{font:500 15px var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn .m{font:400 12px var(--ui);color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn .m .in{color:var(--red)}
.pn .m .inj{color:#ff9500;font-weight:700}
.pp{text-align:right;min-width:44px}
.pp .v{font:700 19px/1 var(--num);font-variant-numeric:tabular-nums}
.pp .j{font:400 11px var(--ui);color:var(--fg2)}
.bench .pn .n,.bench .pp .v{color:var(--fg2)}
.bh{padding:6px 14px 2px;font:500 11.5px var(--ui);color:var(--fg2);text-transform:uppercase;letter-spacing:.03em;border-top:.5px solid var(--sep)}
.mu{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:8px 14px;font-size:14px;position:relative}
.mu+.mu::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
.mu .a{text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu .b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu .s{font:700 17px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.mu .w{font-weight:600}
.mu.me{background:color-mix(in srgb,var(--tint) 8%,transparent)}
.fx-top{padding:12px 14px 10px;display:grid;gap:10px}
.fx-top .seg{margin-top:2px}

/* ---------- settings (iOS form) ---------- */
.row{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:.5px solid var(--sep)}
.row .k{flex:none;font-size:16px}
.row .v{margin-left:auto;color:var(--fg2);font-size:15px;text-align:right;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v.ok{color:var(--green)}
.row .v.no{color:var(--red)}
.row select,.row input{margin-left:auto;font:16px var(--ui);color:var(--fg2);background:none;border:0;text-align:right;text-align-last:right;min-width:0;flex:1;-webkit-appearance:none;appearance:none;padding:10px 0}
.row input{color:var(--fg)}
.row.btn{justify-content:center;color:var(--tint);font-size:16px;width:100%}
.row.btn.red{color:var(--red)}
.row.btn:active{background:var(--fill)}
textarea{display:block;width:100%;min-height:76px;border:0;background:none;color:var(--fg);font:13px/1.4 ui-monospace,Menlo,monospace;padding:11px 14px;resize:vertical}
.banner{margin:0 0 8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--green) 16%,var(--card));color:var(--green);font:600 14px var(--ui)}
.code{display:block;margin:6px 16px 0;padding:9px 11px;border-radius:10px;background:var(--fill);font:11.5px/1.45 ui-monospace,Menlo,monospace;word-break:break-all;user-select:all;-webkit-user-select:all;color:var(--fg)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 54px);transform:translateX(-50%);z-index:40;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--fg);padding:9px 16px;border-radius:999px;font:600 14px var(--ui);box-shadow:0 6px 24px rgba(0,0,0,.18);max-width:calc(100% - 32px)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-sport="nfl">
<div class="app">
  <header class="nav">
    <div class="nav-in">
      <button class="chev" id="prevBtn" aria-label="Previous week" hidden><svg viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg></button>
      <div class="ttl"><h1 id="title">Forecheck</h1><small id="subtitle"></small></div>

<script>
'use strict';
/* =====================================================================
   Forecheck: personal NFL + Canadiens live scores, game visuals, where to
   watch Habs games in Montréal, and live fantasy (Sleeper + CBS).
   Data: ESPN public site API, Sleeper public API, CBS Fantasy API
   (with the user's own token). Personal settings stay on this device.
   ===================================================================== */
const TZ = 'America/Toronto';
const NFL_TEAMS = 'ARI ATL BAL BUF CAR CHI CIN CLE DAL DEN DET GB HOU IND JAX KC LAC LAR LV MIA MIN NE NO NYG NYJ PHI PIT SEA SF TB TEN WSH'.split(' ');
const NHL_TEAMS = 'ANA BOS BUF CAR CBJ CGY CHI COL DAL DET EDM FLA LA MIN MTL NJ NSH NYI NYR OTT PHI PIT SEA SJ STL TB TOR UTA VAN VGK WPG WSH'.split(' ');
const PATH = { nfl: 'football/nfl', nhl: 'hockey/nhl' };

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('fc_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fc_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('fc_' + k); } catch (e) {} }
};
const DEFAULTS = { favNFL: 'MIN', favNHL: 'MTL', sleeperLeague: '', sleeperRoster: '', cbsToken: '', cbsTeam: '' };
let CFG = Object.assign({}, DEFAULTS, LS.get('cfg', {}));
const saveCfg = () => LS.set('cfg', CFG);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2400); }

async function getJSON(url, timeout = 15000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), timeout);
  try {
    const r = await fetch(url, { signal: c.signal, cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    try { return JSON.parse(txt); } catch (e) { throw new Error(txt.slice(0, 120) || 'Bad response'); }
  } catch (e) { if (e.name === 'AbortError') throw new Error('Timed out'); throw e; }
  finally { clearTimeout(t); }
}
const espn = (sp, p) => getJSON(`https://site.api.espn.com/apis/site/v2/sports/${PATH[sp]}/${p}`);
const memo = {};
async function cached(key, ms, fn) { const m = memo[key]; if (m && Date.now() - m.t < ms) return m.v; const v = await fn(); memo[key] = { t: Date.now(), v }; return v; }

/* time */
function et(d) { const p = {}; new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23', month: 'numeric', day: 'numeric' }).formatToParts(d).forEach(x => p[x.type] = x.value); return { wd: p.weekday, h: +p.hour % 24, m: +p.minute, mon: +p.month, day: +p.day }; }
const ymd = d => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d).replace(/-/g, '');
const fmtTime = d => d.toLocaleTimeString('en-CA', { hour: 'numeric', minute: '2-digit' }).replace(/\./g, '').toUpperCase();
const fmtDay = d => d.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' }).replace(/\./g, '');
const isToday = d => ymd(d) === ymd(new Date());
const isTomorrow = d => ymd(d) === ymd(new Date(Date.now() + 864e5));
function shortDay(d) { if (isToday(d)) return 'Today'; if (isTomorrow(d)) return 'Tmrw'; const days = (d - Date.now()) / 864e5; if (days > -6 && days < 6) return d.toLocaleDateString('en-CA', { weekday: 'short' }).replace(/\./g, ''); return d.toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }).replace(/\./g, ''); }
function dayWord(d) { return isToday(d) ? 'Today' : isTomorrow(d) ? 'Tomorrow' : fmtDay(d); }
const whenLabel = d => dayWord(d) + ' · ' + fmtTime(d);
const qLab = n => (+n > 4 ? 'OT' : 'Q' + (n || ''));
const pLab = n => (+n > 4 ? 'SO' : +n === 4 ? 'OT' : ['', '1st', '2nd', '3rd'][+n] || '');
const secs = s => { const m = String(s || '').match(/(\d+):(\d+)/); return m ? +m[1] * 60 + +m[2] : 0; };

/* colour */
function lum(hex) { const n = parseInt(String(hex).replace('#', '').padEnd(6, '0').slice(0, 6), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }).reduce((a, v, i) => a + v * [.2126, .7152, .0722][i], 0); }
const contrast = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
const onInk = c => lum(c) > .36 ? '#10161c' : '#ffffff';
const darkUI = () => matchMedia('(prefers-color-scheme: dark)').matches;
const cardBg = () => darkUI() ? '#1c1c1e' : '#ffffff';
function teamInk(t) { const bg = cardBg(); const a = t.color, b = t.alt; if (contrast(a, bg) >= 2) return a; return contrast(b, bg) > contrast(a, bg) ? b : a; }
function pairInk(g) { let h = teamInk(g.home), a = teamInk(g.away); if (contrast(h, a) < 1.35) { const alt = g.away.alt; if (contrast(alt, h) > contrast(a, h)) a = alt; } return { h, a }; }
function slabColor(t) { for (const c of [t.color, t.alt]) if (c && contrast(c, '#ffffff') >= 3.2) return c; return '#2b3440'; }

/* ---------- ESPN normalising ---------- */
function mkTeam(sp, c) {
  const t = c.team || {}; const abbr = t.abbreviation || '';
  const logo = t.logo || (t.logos && t.logos[0] && t.logos[0].href) || `https://a.espncdn.com/i/teamlogos/${sp}/500/${abbr.toLowerCase()}.png`;
  const logoDark = logo.includes('/500/') ? logo.replace('/500/', '/500-dark/') : logo;
  const recs = c.records || c.record || [];
  const rec = Array.isArray(recs) ? ((recs.find(r => r.type === 'total') || recs[0] || {}).summary || '') : '';
  let score = c.score; if (score && typeof score === 'object') score = score.displayValue;
  return { id: String(t.id || c.id || ''), abbr, name: t.shortDisplayName || t.name || abbr, color: '#' + (t.color || '55606a'), alt: '#' + (t.alternateColor || '9aa4ad'), logo, logoDark, score: score ?? '', rec, winner: !!c.winner, ls: c.linescores || [] };
}
function mkGame(sp, ev) {
  const c = ev.competitions[0]; const st = c.status || ev.status;
  const H = c.competitors.find(x => x.homeAway === 'home'), A = c.competitors.find(x => x.homeAway === 'away');
  const season = ev.season || {};
  return {
    sp, id: String(ev.id || c.id), date: new Date(ev.date || c.date), state: st.type.state, detail: st.type.shortDetail || st.type.detail || '', period: st.period, clock: st.displayClock,
    home: mkTeam(sp, H), away: mkTeam(sp, A), sit: c.situation || null, venue: c.venue && c.venue.fullName, note: (c.notes && c.notes[0] && c.notes[0].headline) || '',
    stype: season.type || 2

}
const isFav = (sp, abbr) => abbr && abbr === (sp === 'nfl' ? CFG.favNFL : CFG.favNHL);
const hasFav = g => isFav(g.sp, g.home.abbr) || isFav(g.sp, g.away.abbr);
const FB = "this.onerror=null;this.src=this.dataset.fb";
const logo = (t, onColor) => `<img src="${esc(onColor || darkUI() ? t.logoDark : t.logo)}" data-fb="${esc(t.logo)}" onerror="${FB}" alt="" decoding="async">`;
const FOOT = '<svg class="foot-ic" viewBox="0 0 16 10" aria-label="has the ball"><ellipse cx="8" cy="5" rx="7.2" ry="4.2" fill="#8b4a20" stroke="#fff" stroke-width="1"/><path d="M5 5h6M6.5 3.8v2.4M8 3.8v2.4M9.5 3.8v2.4" stroke="#fff" stroke-width=".9"/></svg>';

/* ---------- where to watch the Habs in Montréal (2026-27 rights) ---------- */
const TV = (name, lang, note) => ({ name, lang, note, kind: 'tv' });
const ST = (name, lang, note) => ({ name, lang, note, kind: 'stream' });
function watchHabs(g) {
  const { wd } = et(g.date); const out = []; let note = '';
  if (/classic|stadium series/i.test(g.note || '')) { out.push(TV('Sportsnet', 'EN'), TV('TVA Sports', 'FR'), ST('Sportsnet+', 'EN'), ST('TVA Sports Direct', 'FR')); note = (g.note || 'Outdoor game') + ': national broadcast.'; }
  else if (wd === 'Sat') { out.push(TV('Sportsnet', 'EN'), TV('TVA Sports', 'FR'), ST('Sportsnet+', 'EN'), ST('TVA Sports Direct', 'FR')); note = 'Saturday Habs games are usually national. If not, TSN2 and RDS.'; }
  else if (wd === 'Wed') { out.push(ST('Prime Video', 'EN/FR', 'if national'), TV('TSN2', 'EN'), TV('RDS', 'FR')); note = 'National Wednesday games are exclusive to Prime Video. Otherwise TSN2 and RDS.'; }
  else if (wd === 'Mon') { out.push(ST('Sportsnet+', 'EN', 'if Monday Night Hockey'), TV('TSN2', 'EN'), TV('RDS', 'FR')); note = 'Six Habs Monday games stream only on Sportsnet+. The rest are on TSN2 and RDS.'; }
  else { out.push(TV('TSN2', 'EN'), TV('RDS', 'FR'), ST('TSN app', 'EN'), ST('RDS app', 'FR')); note = 'Regional game. A few are national instead (Sportsnet / TVA Sports).'; }
  return { items: out, note, link: 'https://www.nhl.com/canadiens/schedule', linkText: 'Canadiens broadcast schedule' };
}
const showWatch = g => g.sp === 'nhl' && hasFav(g) && g.state !== 'post';
const PLAY = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z" fill="currentColor"/></svg>';
const TVIC = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="3" width="13" height="8.5" rx="1.6"/><path d="M5.5 14h5"/></svg>';
const chip = x => `<span class="chip">${x.kind === 'stream' ? PLAY : ''}${esc(x.name)}${x.lang ? ` <span class="lng">${esc(x.lang)}</span>` : ''}</span>`;
const tvLine = g => `<span class="tv">${TVIC}${watchHabs(g).items.slice(0, 3).map(x => esc(x.name)).join(' · ')}</span>`;

/* ---------- football situation ---------- */
function ownFromText(txt, offAbbr) { const m = String(txt || '').trim().match(/^([A-Z]{2,4})?\s*(\d{1,2})$/); if (!m) return null; const n = +m[2]; if (n === 50) return 50; if (!m[1]) return null; return m[1] === offAbbr ? n : 100 - n; }
function nflSit(g) {
  const s = g.sit; if (!s || g.state !== 'in') return null;
  const offId = String(s.possession || ''); const off = offId === g.home.id ? g.home : offId === g.away.id ? g.away : null;
  if (!off) return { text: s.lastPlay && s.lastPlay.text };
  return { off, def: off === g.home ? g.away : g.home, own: ownFromText(s.possessionText, off.abbr), dist: s.distance, dd: s.shortDownDistanceText || s.downDistanceText || '', spot: s.possessionText || '', rz: !!s.isRedZone, text: s.lastPlay && s.lastPlay.text, goal: /goal/i.test(s.downDistanceText || '') };
}
function gauge(si, g) {
  if (!si || si.own == null) return '';
  const ink = pairInk(g); const oc = si.off === g.home ? ink.h : ink.a, dc = si.off === g.home ? ink.a : ink.h;
  const x = v => (7 + v * .86).toFixed(2) + '%';
  const fd = si.dist && !si.goal && si.own + si.dist < 100 ? `<i class="fd" style="left:${x(si.own + si.dist)}"></i>` : '';
  return `<div class="gauge" aria-hidden="true"><i class="ez" style="left:0;background:${oc}"></i><i class="ez" style="right:0;background:${dc}"></i><i class="los" style="left:${x(si.own)}"></i>${fd}<i class="ball" style="left:${x(si.own)}"></i></div>`;
}

/* ---------- compact game row ---------- */
function statusCol(g) {
  if (g.state === 'in') {
    const d = g.detail || '';
    if (/half|end|intermission|delay|suspend/i.test(d)) return `<b class="live">${esc(d.replace(/^End of /i, 'End ').replace(/ - /, ' '))}</b>`;
    return `<b class="live">${esc(g.sp === 'nfl' ? qLab(g.period) : pLab(g.period))}</b><span>${esc(g.clock || '')}</span>`;
  }
  if (g.state === 'pre') return `<b>${esc(shortDay(g.date))}</b><span>${esc(fmtTime(g.date))}</span>`;
  const ot = /(OT|SO)/.exec(g.detail || ''); return `<b>Final</b>${ot ? `<span>${ot[1]}</span>` : ''}`;
}
function line(g, t, si) {
  const lose = g.state === 'post' && !t.winner && (g.home.winner || g.away.winner);
  return `<div class="ln${lose ? ' lose' : ''}">${logo(t)}<span class="ab">${esc(t.abbr)}</span>${isFav(g.sp, t.abbr) ? '<span class="star">★</span>' : ''}${si && si.off === t ? FOOT : ''}<span class="rec">${esc(t.rec)}</span><span class="sc">${g.state === 'pre' ? '' : esc(t.score)}</span></div>`;
}
function gameRow(g) {
  const si = g.sp === 'nfl' ? nflSit(g) : null;
  let x = '';
  if (si && si.off) x = `<div class="gr-x">${gauge(si, g)}<span class="t">${esc(si.dd)}${si.spot ? ' at ' + esc(si.spot) : ''}</span>${si.rz ? '<b class="rz">RZ</b>' : ''}</div>`;
  else if (showWatch(g)) x = `<div class="gr-x">${tvLine(g)}</div>`;
  return `<button class="gr" data-open="${g.sp}:${g.id}"><div>${line(g, g.away, si)}${line(g, g.home, si)}</div><div class="gs">${statusCol(g)}</div>${x}</button>`;
}
const group = (title, rows, cls = '') => rows ? `<h2 class="gh ${cls}">${title}</h2><div class="group">${rows}</div>` : '';
function sec(title, right, body, foot) { return `<h2 class="gh"><span>${title}</span>${right ? `<span class="r">${right}</span>` : ''}</h2><div class="group pad">${body}</div>${foot ? `<p class="foot">${foot}</p>` : ''}`; }

/* ---------- score bug ---------- */
function bug(G, { lg = false, sog = null } = {}) {
  const pre = G.state === 'pre', live = G.state === 'in';
  const si = G.sp === 'nfl' && live ? nflSit(G) : null;
  const slab = t => { const lose = G.state === 'post' && !t.winner && (G.home.winner || G.away.winner); return `<div class="bt${lose ? ' lose' : ''}" style="--c:${slabColor(t)}">${logo(t, true)}<span class="stack"><span class="ab">${esc(t.abbr)}</span>${sog ? `<span class="sog">SOG ${esc(sog[t === G.home ? 'h' : 'a'])}</span>` : ''}</span>${si && si.off === t ? FOOT : ''}<span class="bs">${pre ? `<small>${esc(t.rec)}</small>` : esc(t.score)}</span></div>`; };
  let c;
  if (live) { const d = G.detail || ''; c = /half|end|intermission/i.test(d) ? `<span class="c1">${esc(d.replace(/^End of /i, 'End '))}</span>` : `<span class="c1">${esc(G.sp === 'nfl' ? qLab(G.period) : pLab(G.period))}</span><span class="c2">${esc(G.clock || '')}</span>`; }
  else if (pre) c = `<span class="c1">${esc(shortDay(G.date))}</span><span class="c2">${esc(fmtTime(G.date))}</span>`;
  else { const ot = /(OT|SO)/.exec(G.detail || ''); c = `<span class="c1">Final</span>${ot ? `<span class="c2">${ot[1]}</span>` : ''}`; }
  return `<div class="bug ${G.sp}${lg ? ' lg' : ''}">${slab(G.away)}${slab(G.home)}<div class="bc${live ? ' on' : ''}">${c}</div></div>`;
}
function flagUnder(G) {
  const si = G.sp === 'nfl' && G.state === 'in' ? nflSit(G) : null; if (!si) return '';
  return `${si.off ? `<div class="flag"><b>${esc(si.dd || '')}</b><span>${si.spot ? 'at ' + esc(si.spot) : ''}</span>${si.rz ? '<b class="rz" style="background:var(--red);color:#fff">RED ZONE</b>' : ''}</div>${gauge(si, G)}` : ''}${si.text ? `<div class="play">${esc(si.text)}</div>` : ''}`;
}

/* ---------- favourite team ---------- */
async function teamSchedule(sp, abbr) {
  return cached('sched:' + sp + abbr, 10 * 60e3, async () => {
    const j = await espn(sp, 'teams/' + abbr.toLowerCase() + '/schedule');
    return { team: j.team || {}, games: (j.events || []).map(e => { try { return mkGame(sp, e); } catch (x) { return null; } }).filter(Boolean) };
  });
}
const resultLine = (g, ab) => { const me = g.home.abbr === ab ? g.home : g.away, o = me === g.home ? g.away : g.home; const wl = me.winner ? 'W' : o.winner ? 'L' : 'T'; const ot = /(OT|SO)/.exec(g.detail || ''); return `${wl} ${esc(me.score)}–${esc(o.score)}${ot ? ' ' + ot[1] : ''} ${me === g.home ? 'vs' : '@'} ${esc(o.abbr)}`; };
const nextLine = (g, ab) => { const o = g.home.abbr === ab ? g.away : g.home; return `${g.home.abbr === ab ? 'vs' : '@'} ${esc(o.abbr)} · ${esc(whenLabel(g.date))}`; };
async function heroHTML(sp, games, extra = {}) {
  const ab = sp === 'nfl' ? CFG.favNFL : CFG.favNHL; if (!ab) return '';
  const g = games.find(x => x.home.abbr === ab || x.away.abbr === ab);
  let next = null, last = null, team = {};
  try { const sc = await teamSchedule(sp, ab); team = sc.team; next = sc.games.find(x => x.state !== 'post' && x.date > Date.now() - 6 * 36e5 && (!g || x.id !== g.id)); const done = sc.games.filter(x => x.state === 'post' && (!g || x.id !== g.id)); last = done[done.length - 1]; } catch (e) {}
  if (g) {

  return renderFx({ key: 'sv', title: lg.name || 'Sleeper', src: 'Sleeper', week: wk, me, opp, league: Object.values(pairs).map(arr => arr.map(teamOf)), nfl });
}
async function cbsCall(path, extra = '') {
  const j = await getJSON(`https://api.cbssports.com/fantasy/${path}?version=3.0&response_format=JSON&access_token=${encodeURIComponent(CFG.cbsToken)}${extra}`);
  if (j && (j.error || (j.statusCode && j.statusCode >= 400))) throw new Error(typeof j.error === 'string' ? j.error : (j.statusMessage || 'CBS refused the request'));
  return (j && j.body) || {};
}
async function cbsBlock(nfl) {
  const wk = nfl.week; const b = await cbsCall('league/scoring/live', '&period=' + wk);
  const ls = b.live_scoring || b; const teams = ls.teams || []; if (!teams.length) throw new Error('CBS returned no teams for week ' + wk);
  const num = v => { const n = parseFloat(v); return isNaN(n) ? null : n; };
  const T = teams.map(t => {
    const rows = (t.players || []).map(p => {
      const status = String(p.status || p.roster_status || p.roster_pos || '').toUpperCase(); const st = !/^(RS|BN|B|IR|RES)/.test(status);
      const team = p.pro_team || p.team || ''; const pts = num(p.fpts ?? p.pts ?? p.points) || 0; const pj = num(p.proj_fpts ?? p.proj_pts ?? p.projected_points ?? p.fpts_proj);
      const g = nfl.map[nflAbbr(team)]; const rem = nfl.byes.includes(nflAbbr(team)) ? 0 : remainFrac(g);
      return { name: p.fullname || p.full_name || p.name || '?', pos: p.position || '', team, slot: st ? (p.position || '') : 'BN', st, pts, proj: pj, est: pj != null ? pts + pj * rem : pts, left: rem > 0 && g && g.state !== 'post', inj: p.injury || p.injury_status || '' };
    }); rows.sort((a, b) => b.st - a.st);
    const sp = rows.filter(r => r.st);
    return { rid: String(t.id), name: t.name || t.long_name || 'Team ' + t.id, pts: num(t.pts ?? t.points ?? t.fpts) ?? sp.reduce((a, r) => a + r.pts, 0), est: sp.reduce((a, r) => a + r.est, 0), rows, left: sp.filter(r => r.left).length, opp: t.opponent || t.opponent_id || (t.matchup && t.matchup.opponent_id) };
  });
  const oid = t => String(typeof t.opp === 'object' ? t.opp.id : t.opp);
  const me = T.find(t => t.rid === String(CFG.cbsTeam)); const opp = me && me.opp != null ? T.find(t => t.rid === oid(me)) : null;
  if (me) me.rows.forEach(r => addMine(r.name, 'CBS'));
  let league = [];
  if (T.some(t => t.opp != null)) { const seen = new Set(); T.forEach(t => { if (seen.has(t.rid)) return; const o = T.find(x => x.rid === oid(t)); seen.add(t.rid); if (o) { seen.add(o.rid); league.push([t, o]); } else league.push([t]); }); }
  else league = T.slice().sort((a, b) => b.pts - a.pts).map(t => [t]);
  return renderFx({ key: 'cv', title: 'BELL MIRABEL', src: 'CBS', week: wk, me, opp, league, nfl });
}
const fmtP = v => v == null ? '–' : (Math.round(v * 10) / 10).toFixed(1);
function ncdf(z) { const t = 1 / (1 + .3275911 * Math.abs(z) / Math.SQRT2); const e = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - .284496736) * t + .254829592) * t * Math.exp(-z * z / 2); return .5 * (1 + Math.sign(z) * e); }
function renderFx({ key, title, src, week, me, opp, league, nfl }) {
  const view = me ? S.fx[key] : 'lg';
  let top = '';
  if (me) {
    const side = (t, r) => `<div class="t${r ? ' r' : ''}"><div class="nm">${esc(t.name)}</div><div class="p">${fmtP(t.pts)}</div><div class="pj">proj ${fmtP(t.est)} · ${t.left} left</div></div>`;
    top += `<div class="mx">${side(me)}${opp ? `<div class="vs">VS</div>${side(opp, true)}` : ''}</div>`;
    if (opp) { const sd = Math.max(4, Math.sqrt(me.left + opp.left) * 7.5); const odds = Math.round(clamp(ncdf((me.est - opp.est) / sd), .01, .99) * 100); top += `<div class="wb" aria-hidden="true"><i style="width:${odds}%;background:var(--tint)"></i><i style="flex:1;background:var(--fg3)"></i></div><div class="wbl"><span>Win chance ${odds}%</span><span>${100 - odds}%</span></div>`; }
    top += `<div class="seg" role="group"><button data-fx="${key}:me" aria-pressed="${view === 'me'}">My lineup</button>${opp ? `<button data-fx="${key}:opp" aria-pressed="${view === 'opp'}">Opponent</button>` : ''}<button data-fx="${key}:lg" aria-pressed="${view === 'lg'}">League</button></div>`;
  } else top += `<div class="foot" style="margin:0">Pick your team in Settings to see your lineup.</div>`;
  let body = '';
  if (view === 'lg') {
    const myId = me && me.rid;
    body = league.map(([a, b]) => { if (!b) return `<div class="mu${a.rid === myId ? ' me' : ''}"><span class="a">${esc(a.name)}</span><span class="s">${fmtP(a.pts)}</span><span class="b" style="color:var(--fg2);font-size:12px">proj ${fmtP(a.est)}</span></div>`; const aw = a.pts >= b.pts; return `<div class="mu${a.rid === myId || b.rid === myId ? ' me' : ''}"><span class="a ${aw ? 'w' : ''}">${esc(a.name)}</span><span class="s">${fmtP(a.pts)} <span style="color:var(--fg3)">–</span> ${fmtP(b.pts)}</span><span class="b ${aw ? '' : 'w'}">${esc(b.name)}</span></div>`; }).join('');
  } else {
    const t = view === 'opp' && opp ? opp : me;
    const row = r => `<div class="pl${r.st ? '' : ' bench'}"><span class="slot">${esc(r.slot || r.pos)}</span><div class="pn"><div class="n">${esc(r.name)}${r.inj ? ` <span style="color:#ff9500;font-size:11px;font-weight:700">${esc(String(r.inj).slice(0, 3).toUpperCase())}</span>` : ''}</div><div class="m">${esc(r.pos)}${r.team ? ' ' + esc(r.team) : ''}${gameTag(r.team, nfl)}</div></div><div class="pp"><div class="v">${fmtP(r.pts)}</div><div class="j">${r.proj != null ? fmtP(r.proj) : ''}</div></div></div>`;
    const st = t.rows.filter(r => r.st), bn = t.rows.filter(r => !r.st);
    body = st.map(row).join('') + (bn.length ? `<div class="bh">Bench</div>` + bn.map(row).join('') : '');
  }
  return `<h2 class="gh"><span>${esc(title)}</span><span class="r">${esc(src)} · Week ${esc(week)}</span></h2><div class="group"><div class="fx-top">${top}</div>${body ? `<div style="border-top:.5px solid var(--sep)">${body}</div>` : ''}</div>`;
}
async function loadFx() {
  const nfl = await nflNow();
  if (S.tab === 'fx' && !S.sheetMode) setHeader('Fantasy', `Week ${esc(nfl.week)}`, false);
  const jobs = [];
  if (CFG.sleeperLeague) jobs.push(sleeperBlock(nfl).catch(e => `<h2 class="gh">PFL</h2><div class="err">Sleeper: ${esc(e.message)}</div>`));
  if (CFG.cbsToken) jobs.push(cbsBlock(nfl).catch(e => `<h2 class="gh">CBS</h2><div class="err">${esc(e.message)}. The token may have expired; get a fresh one in Settings.</div>`));
  const parts = await Promise.all(jobs);
  if (!CFG.sleeperLeague && !CFG.cbsToken) parts.push(`<h2 class="gh">Connect your leagues</h2><div class="group"><button class="row btn" data-settings>Open Settings</button></div><p class="foot">Paste your setup code in Settings. Everything stays on this phone.</p>`);
  else if (!CFG.cbsToken && CFG.cbsTeam) parts.push(`<h2 class="gh">CBS</h2><div class="group"><button class="row btn" data-settings>Add your CBS token</button></div>`);
  const live = Object.values(nfl.map).some(g => g.state === 'in');
  if (S.tab !== 'fx' || S.sheetMode) return live;
  $('#view').innerHTML = parts.join('');
  return live;
}
async function warmMine() { try { const nfl = await nflNow(); if (CFG.sleeperLeague) await sleeperBlock(nfl); if (CFG.cbsToken) await cbsBlock(nfl); } catch (e) {} }

/* =====================================================================
   SETTINGS
   ===================================================================== */
const BOOKMARKLET = "javascript:(()=>{const m=document.documentElement.outerHTML.match(/token[\"']?\\s*[:=]\\s*[\"']([A-Za-z0-9_\\-.]{20,})[\"']/);if(!m){alert('No CBS token on this page. Open your CBS league while signed in.');return}navigator.clipboard.writeText(m[1]).then(()=>alert('CBS token copied. Paste it into Forecheck Settings.'),()=>prompt('Copy this CBS token:',m[1]))})();";
function decodeSetup(raw) { const j = JSON.parse(decodeURIComponent(escape(atob(String(raw || '').replace(/\s+/g, '').replace(/^FC1/, ''))))); if (!j || typeof j !== 'object') throw new Error('bad'); return j; }
function fillSleeperTeams(users, rosters) {
  const sel = $('#sfSlTeam'); if (!sel) return;
  sel.innerHTML = rosters.map(r => { const u = users.find(x => x.user_id === r.owner_id) || {}; const n = (u.metadata && u.metadata.team_name) || u.display_name || 'Roster ' + r.roster_id; return `<option value="${r.roster_id}" ${String(r.roster_id) === String(CFG.sleeperRoster) ? 'selected' : ''}>${esc(n)}</option>`; }).join('');
}
async function renderStatus(banner) {
  const box = $('#sfStatus'); if (!box) return;
  const row = (k, cls, v) => `<div class="row"><span class="k">${esc(k)}</span><span class="v ${cls}">${v}</span></div>`;
  let sl = CFG.sleeperLeague ? 'Checking…' : 'Not set up', slc = '';
  const cb = CFG.cbsToken ? (CFG.cbsTeam ? '✓ Token saved' : 'Pick your team') : CFG.cbsTeam ? 'Needs your token' : 'Not set up';
  const paint = () => { $('#sfBanner').innerHTML = banner ? `<div class="banner">${banner}</div>` : ''; box.innerHTML = row('Favourites', 'ok', '✓ ' + esc([CFG.favNFL, CFG.favNHL].filter(Boolean).join(' · ') || 'None')) + row('Sleeper', slc, sl) + row('CBS', CFG.cbsToken ? 'ok' : '', cb); };
  paint();
  if (CFG.sleeperLeague) {
    try {
      const [lg, users, rosters] = await Promise.all([SL('league/' + CFG.sleeperLeague), SL('league/' + CFG.sleeperLeague + '/users'), SL('league/' + CFG.sleeperLeague + '/rosters')]);
      if (!lg) throw new Error('league not found');
      const r = rosters.find(x => String(x.roster_id) === String(CFG.sleeperRoster)); const u = r && users.find(x => x.user_id === r.owner_id);
      sl = '✓ ' + esc(lg.name) + (u ? ' · ' + esc((u.metadata && u.metadata.team_name) || u.display_name) : ' · pick your team'); slc = 'ok';
      fillSleeperTeams(users, rosters);
    } catch (e) { sl = '✕ ' + esc(e.message); slc = 'no'; }
    paint();
  }
}
function openSettings(banner) {
  openSheet('settings', 'Settings', 'Back');
  $('#shRight').innerHTML = '<button class="done" id="sfSave">Save</button>';
  const opt = (list, v) => list.map(a => `<option ${a === v ? 'selected' : ''}>${a}</option>`).join('');
  $('#shBody').innerHTML = `
  <div id="sfBanner"></div>
  <h2 class="gh">Status</h2><div class="group" id="sfStatus"></div>

  <h2 class="gh">Setup code</h2><div class="group"><textarea id="sfCode" placeholder="Paste your FC1… code here" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Setup code"></textarea><button class="row btn" id="sfApply" style="border-top:.5px solid var(--sep)">Apply code</button></div>
  <p class="foot" id="sfCodeMsg" role="status">Fills in your teams and leagues in one go.</p>

  <h2 class="gh">Favourite teams</h2><div class="group">
    <label class="row"><span class="k">NFL</span><select id="sfNfl"><option value="">None</option>${opt(NFL_TEAMS, CFG.favNFL)}</select></label>
    <label class="row"><span class="k">NHL</span><select id="sfNhl">${opt(NHL_TEAMS, CFG.favNHL)}</select></label></div>

  <h2 class="gh">Sleeper</h2><div class="group">
    <label class="row"><span class="k">League ID</span><input id="sfSl" inputmode="numeric" autocomplete="off" value="${esc(CFG.sleeperLeague)}" placeholder="Required"></label>
    <label class="row"><span class="k">Your team</span><select id="sfSlTeam"><option value="${esc(CFG.sleeperRoster)}">${CFG.sleeperRoster ? 'Loading…' : 'Load teams first'}</option></select></label>
    <button class="row btn" id="sfSlLoad">Load teams</button></div>

  <h2 class="gh">CBS</h2><div class="group">
    <label class="row"><span class="k">Token</span><input id="sfCbs" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(CFG.cbsToken)}" placeholder="Paste token"></label>
    <label class="row"><span class="k">Your team</span><select id="sfCbsTeam"><option value="${esc(CFG.cbsTeam)}">${CFG.cbsTeam ? 'Team ' + esc(CFG.cbsTeam) : 'Load teams first'}</option></select></label>
    <button class="row btn" id="sfCbsLoad">Load teams</button>
    <button class="row btn" id="sfCopyBm">Copy bookmark code</button></div>
  <p class="foot">CBS has no public login for apps like this, so Forecheck uses the token CBS gives your own league page. On your Mac, make a bookmark whose address is the code below, open your CBS league while signed in, and click it. It copies the token; Universal Clipboard lets you paste it here. Tokens can expire; if CBS stops loading, repeat this.</p>
  <code class="code" id="bmk">${esc(BOOKMARKLET)}</code>

  <h2 class="gh">Data</h2><div class="group"><button class="row btn red" id="sfReset">Clear saved data</button></div>

  $('#sfReset').onclick = () => { const b = $('#sfReset'); if (b.dataset.armed) { LS.del('cfg'); LS.del('sp_players'); CFG = Object.assign({}, DEFAULTS); MY_NAMES.clear(); toast('Cleared'); closeSheet(); } else { b.dataset.armed = '1'; b.textContent = 'Tap again to clear everything'; } };

/* =====================================================================
   REFRESH LOOP + EVENTS
   ===================================================================== */
async function refresh(force) {
  clearTimeout(S.timer);
  if (document.hidden && !force) { S.timer = setTimeout(refresh, 30e3); return; }
  if (S.busy && !force) return; S.busy = true; $('#refreshBtn').classList.add('busy');
  let live = false;
  try {
    if (S.sheetMode === 'game') live = await loadDetail();
    else if (S.sheetMode === 'settings') live = S.live;
    else if (S.tab === 'nfl') live = await loadNFL();
    else if (S.tab === 'nhl') live = await loadNHL();
    else live = await loadFx();
    setUpdated(live);
  } catch (e) {
    const msg = navigator.onLine === false ? 'You’re offline. Scores refresh when you reconnect.' : 'Couldn’t load (' + e.message + '). Retrying shortly.';
    if (!S.sheetMode && !$('#view').querySelector('.gr,.hero,.group')) $('#view').innerHTML = `<div class="err">${esc(msg)}</div>`; else toast(msg);
  } finally {
    S.busy = false; $('#refreshBtn').classList.remove('busy');
    S.timer = setTimeout(refresh, live ? 15e3 : 60e3);
  }
}
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) { const [sp, id] = o.dataset.open.split(':'); openGame(sp, id); return; }
  const t = e.target.closest('[data-tab]'); if (t) { if (S.sheetMode) { S.sheetMode = null; S.detail = null; $('#sheet').classList.remove('open'); } setTab(t.dataset.tab); return; }
  if (e.target.closest('[data-now]')) { S.nfl.q = null; refresh(true); return; }
  const p = e.target.closest('[data-ptab]'); if (p && S.detail) { S.detail.tab = p.dataset.ptab; renderDetail(); return; }
  const f = e.target.closest('[data-fx]'); if (f) { const [k, v] = f.dataset.fx.split(':'); S.fx[k] = v; refresh(true); return; }
  if (e.target.closest('[data-settings]')) { openSettings(); return; }
});
$('#prevBtn').onclick = () => shiftWeek(-1);
$('#nextBtn').onclick = () => shiftWeek(1);
$('#sheetBack').onclick = closeSheet;
$('#settingsBtn').onclick = () => openSettings();
$('#refreshBtn').onclick = () => { delete memo.nflnow; refresh(true); };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheetMode) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
window.addEventListener('online', () => refresh(true));
const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', () => { if (S.sheetMode === 'game') renderDetail(); else refresh(true); });

setTab(['nfl', 'nhl', 'fx'].includes(S.tab) ? S.tab : 'nfl');
warmMine();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
